[package]
name = "governance-copilot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
governance-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
jsonwebtoken.workspace = true
cratestack.workspace = true
# `send_with_retry`'s backoff sleep (client.rs) -- the same precedent as
# governance-core's deadlock-retry loop (crates/governance-core/src/ingest.rs):
# a plain `tokio::time::sleep` loop, not a new retry crate, because the
# workspace's tokio already carries the `time` feature and every caller of
# this crate already runs on a `tokio::main` runtime.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow.workspace = true
# Test-only mock GitHub server (tests/support/mock_github.rs). Already a
# pinned workspace dependency (the server binaries use it); reusing it here
# adds no new crate to the supply chain and keeps the mock strictly under
# tests/, never reachable from src/ (see app/governance-auth/Cargo.toml for
# the same precedent with its mock OIDC server).
axum.workspace = true
