# Local development only. Nothing here is deployed -- the deployed shape is the
# Helm chart in charts/, consumed by ai-helm.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lightbridge_governance
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ manages a major-version-specific subdirectory itself and
      # expects the volume mounted at the parent -- mounting straight at
      # .../data (the pre-18 convention) makes the container exit 1 on start.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
