name: Release governance-auth binaries

# `governance-auth` is distributed to developer laptops, NOT bundled into the
# server image (ADR-0010) -- so it needs its own asset build. `self update`
# consumes exactly what this publishes: a RAW binary per platform plus a
# sibling `.sha256`. Both names are load-bearing; `app/governance-auth/src/
# update.rs::asset_name` must stay in lockstep with the matrix below, or
# self-update reports "no asset for your platform".
on:
  release:
    types: [published]
  # Manual runs let a release that was cut before this workflow existed (or
  # one whose upload failed) be backfilled without re-tagging.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ⚠️ MUSL IS THE ONE TO INSTALL ON LINUX. The gnu builds below link
          # against the RUNNER's glibc (2.39 on ubuntu-24.04, which is what
          # both `ubuntu-latest` and `ubuntu-24.04-arm` are), and Rust's
          # `std::process::Command` pulls in `GLIBC_2.39`-versioned symbols
          # when the build host is new enough. That binary will NOT START on
          # Ubuntu 22.04 (2.35), Debian 12 (2.36), RHEL/Rocky 9 (2.34) or
          # Amazon Linux 2023 (2.34) -- it fails in the dynamic loader before
          # `main`, with `version 'GLIBC_2.39' not found`, so it reads as a
          # corrupt download rather than an OS mismatch.
          #
          # The musl targets are statically linked (`crt-static` is on by
          # default for musl) and carry no glibc dependency at all.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          # Kept as a FALLBACK, not the default. musl's libc implements no
          # NSS: it never reads `/etc/nsswitch.conf` and never loads
          # `nss-resolve`, so on a laptop whose DNS is resolved through
          # systemd-resolved's NSS module rather than a real
          # `/etc/resolv.conf`, a musl build can fail to resolve the issuer
          # while every glibc tool on the same machine succeeds. That case
          # has NOT been reproduced here -- the gnu assets exist so it has an
          # answer if it shows up, on a distro new enough to run them.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # Cross-compiled from Apple Silicon, NOT built on an Intel runner.
          # `macos-13` was retired by GitHub in December 2025 and this entry
          # used to name it, so an Intel build could not even be scheduled.
          # `macos-15-intel` exists but is itself retired in 2027, so it only
          # defers this; Apple's toolchain cross-links x86_64 from arm64
          # natively. Two per-arch assets, not a `lipo` universal binary --
          # `update.rs::asset_name()` selects one asset per (os, arch), so a
          # universal binary would need a new name and a code change for no
          # benefit.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `aws-lc-sys` compiles C, so a musl build needs a musl-targeting C
      # compiler. ⚠️ This binary resolves to `aws-lc-rs`, NOT `ring`, despite
      # the workspace pinning `rustls = { features = ["ring"] }` -- that pin
      # only binds crates depending on `rustls` DIRECTLY, which is the server,
      # not this binary (it gets rustls transitively through `reqwest`, whose
      # `rustls` feature maps to `__rustls-aws-lc-rs`). Confirmed with
      # `cargo tree`, not assumed from the manifest comment.
      #
      # Only a C compiler is needed: cmake and Go are required for FIPS
      # builds, which this is not, and pre-generated bindings ship for both
      # musl targets.
      - name: Install musl toolchain
        if: contains(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # cc-rs reads CC_<target with underscores>; without it the build
          # picks the host gcc and fails to link against musl.
          echo "CC_$(echo '${{ matrix.target }}' | tr - _)=musl-gcc" >> "$GITHUB_ENV"

      # Only this binary. The workspace also contains the server and the
      # collector CLI, which are shipped as a container image instead --
      # building them here would triple the job for artefacts nobody
      # downloads from a release.
      #
      # `--profile prod` (thin LTO, codegen-units=1, strip=true), not the
      # default `release`: these assets are downloaded by every developer and
      # replaced by `self update`, and stock `release` ships them unstripped.
      # ⚠️ `GOVERNANCE_AUTH_RELEASE_VERSION` IS LOAD-BEARING, not metadata.
      #
      # release-please runs `release-type: simple` here, which bumps the
      # manifest and `Chart.yaml` but NOT `Cargo.toml`, so `[workspace.package]
      # version` stays behind the tag. v0.2.0 shipped binaries reporting
      # `0.1.0`; `self update` saw `0.2.0 > 0.1.0` on every single invocation
      # and reinstalled forever. Injecting the tag being built is what lets a
      # released binary recognise itself and stop.
      #
      # Consumed by `update::VERSION` via `option_env!`. Safe against the
      # `rust-cache` restore above (keyed on the target triple alone, so every
      # release after the first hits a warm cache): rustc records the variable
      # in the unit's dep-info as `# env-dep:GOVERNANCE_AUTH_RELEASE_VERSION=…`
      # and cargo fingerprints it, so changing the tag forces a rebuild. That
      # was measured, not assumed -- a `rerun-if-env-changed` build script was
      # written for this and deleted once the tracking was shown to be
      # automatic.
      - name: Build
        env:
          GOVERNANCE_AUTH_RELEASE_VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: cargo build --profile prod --locked --bin governance-auth --target ${{ matrix.target }}

      - name: Stage asset and checksum
        shell: bash
        run: |
          set -euo pipefail
          name="governance-auth-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/prod/governance-auth" "$name"
          # sha256sum's own format (`<hex>  <filename>`), which is what
          # update.rs parses -- and what a developer can check by hand with
          # `sha256sum -c`.
          if command -v sha256sum >/dev/null; then
            sha256sum "$name" > "$name.sha256"
          else
            # macOS runners ship shasum, not sha256sum.
            shasum -a 256 "$name" > "$name.sha256"
          fi
          # Refuse to upload a checksum that doesn't describe the binary next
          # to it -- a mismatched pair would make every self-update fail
          # closed, which is safe but wastes a release cycle to discover.
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$name.sha256"
          else
            shasum -a 256 -c "$name.sha256"
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Routed through an env var and validated before use, rather than
          # interpolated straight into the shell via `${{ }}` -- the
          # workflow_dispatch `tag` input is supplied by whoever triggers the
          # run, and a value containing shell metacharacters interpolated
          # directly into `run:` is GitHub Actions' well-known script-
          # injection class. `github.event.release.tag_name` doesn't need
          # this (a release's own tag is already `refs/tags/`-safe), but one
          # code path and one check covers both without a second exception.
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *[!A-Za-z0-9._-]*)
              echo "refusing unsafe tag: $TAG" >&2
              exit 1
              ;;
          esac
          gh release upload "$TAG" \
            "governance-auth-${{ matrix.target }}" \
            "governance-auth-${{ matrix.target }}.sha256" \
            --clobber --repo "${{ github.repository }}"
