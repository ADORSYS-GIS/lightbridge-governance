name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing (push runs only) needs to mint its own OIDC
      # token from the GitHub Actions identity provider.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The governance API + CLI.
          - image: ghcr.io/adorsys-gis/lightbridge-governance
            dockerfile: .docker/Dockerfile
          # The redaction proxy. A separate image on purpose -- see the comment
          # at the top of its Dockerfile: it shares a workspace with the API but
          # not a dependency tree, and bundling them would put the API's
          # cratestack/sqlx/aws-sdk-s3 surface into the Trivy result for the
          # component that sits fail-closed in front of every AI request.
          - image: ghcr.io/adorsys-gis/redact-gateway
            dockerfile: .docker/Dockerfile.redact-gateway
          # ADR-0116: redact-gateway's replacement, an Envoy ext_proc sidecar
          # instead of a front proxy. A third separate image for the same
          # reason as redact-gateway's own comment above -- its dependency
          # tree (envoy-types/tonic/prost/pii) overlaps with neither of the
          # other two. Kept alongside redact-gateway rather than replacing
          # its matrix entry: ai-helm's cutover to the sidecar hasn't landed
          # yet, so the front-proxy canary is still the live path. Retire
          # this repo's redact-gateway entry (image + Dockerfile + app
          # binary) in the same change that removes ai-helm's
          # `redact-gateway` app -- hard cutover, not a lingering parallel
          # image.
          - image: ghcr.io/adorsys-gis/redact-extproc
            dockerfile: .docker/Dockerfile.redact-extproc
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # The Dockerfiles build with cargo-auditable. Without it a Trivy scan of
      # these images reports zero Rust packages and a meaningless clean result.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Scoped per image, or the builds share one cache key and thrash.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Keyless cosign signing of the pushed digest (push runs only -- PR
      # builds never push, so there is nothing to sign). This is what lets
      # argocd-image-updater verify provenance before auto-promoting a new
      # tag (signature-type: cosign, matching lightbridge-code-intelligence's
      # own image-updater config) instead of blindly floating to whatever was
      # last pushed. One digest per matrix image; every tag in
      # steps.meta.outputs.tags for a build already points at the same
      # digest, so signing the digest once covers all of them.
      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'
      - name: Sign image
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${{ matrix.image }}@${{ steps.build.outputs.digest }}"
