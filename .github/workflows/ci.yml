name: CI

on:
  push: {}
  pull_request: {}

# A branch with an open PR fires both events; collapse duplicate runs so the
# self-hosted runners are not starved by two identical in-flight builds.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # This repository is PUBLIC, so GitHub-hosted runners are free and the org-wide
  # Actions billing block (which applies to private repos) does not bite. Private
  # repos in this org must use `adorsys-gis-runner` instead -- if this repo is ever
  # made private, these workflows stall in `queued` until they are switched back.
  code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # rustfmt.toml sets `imports_granularity` and `group_imports`, which are
      # NIGHTLY-ONLY. On stable, rustfmt warns and exits 0 — so a stable
      # `cargo fmt --check` would pass without enforcing them, i.e. a check that
      # reports success by doing nothing. The fmt step therefore runs on nightly.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: code-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  sast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        checks: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
