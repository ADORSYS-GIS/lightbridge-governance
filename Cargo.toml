[workspace]
members = [
    "crates/governance-core",
    "crates/governance-copilot",
    "crates/governance-foundry",
    "crates/governance-redact",
    "app/lightbridge-governance",
    "app/governance-ctl",
    "app/governance-auth",
    "app/redact-gateway",
    "app/redact-extproc",
]
resolver = "3"

[workspace.dependencies]
governance-core = { path = "./crates/governance-core" }
governance-copilot = { path = "./crates/governance-copilot" }
governance-foundry = { path = "./crates/governance-foundry" }
governance-redact = { path = "./crates/governance-redact" }

# Const-string formatting, so a `pub const` URL can be derived from a `u16`
# port instead of hand-writing both literals (otel_port). Pure const, no
# runtime cost; MIT/Apache-2.0, already covered by deny.toml's allow-list.
const_format = "0.2.36"

# --- serde / encoding ---
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` so rewriting a developer's `~/.claude/settings.json`
# (governance-auth's OTEL wiring) doesn't reorder the keys they already had --
# it turns the object map into an `indexmap`, which is already in this tree via
# cratestack, so this adds no new crate. Without it a merge-and-write silently
# alphabetises someone's config file.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Format-preserving TOML edit, for the same reason: Codex's `config.toml` is
# hand-maintained and carries comments, and a parse-and-reserialize round trip
# through a plain `toml` Value would delete every one of them.
#
# `serde` feature: ADR-0012 Decision 2 (governance-auth's layered config file)
# deserializes a plain, tool-owned `config.toml` (not hand-maintained, unlike
# Codex's) straight into a struct via `toml_edit::de` rather than adding a
# second TOML crate. Adds `serde_core`/`serde_spanned` to the tree, both
# MIT/Apache-2.0 and already covered by `deny.toml`'s allow-list.
toml_edit = { version = "0.25", features = ["serde"] }
# Templating for the files `governance-auth` generates whole: the shell env
# files, the systemd unit and timer, the launchd agent, and the comment banners
# it injects into TOML it is already editing.
#
# ⚠️ NOT the loopback callback page any more. That is built in
# ADORSYS-GIS/converse-frontends and vendored as one self-contained HTML file
# (`oauth/callback_page/callback.html`), so it shares the product's visual
# identity instead of being hand-written markup in a Jinja template. minijinja
# stays for everything above, which is still template-shaped.
#
# `default-features = false` + `builtins`: the default set pulls `loader`
# (filesystem template loading), which this binary must not have -- templates
# are `include_str!`d at compile time so a single shipped file has no runtime
# template directory to find, or to be swapped.
# `status`'s human dashboard. Here for `user_attended()` -- TTY detection, not
# colour: `token` runs as a subprocess every few minutes and must stay silent,
# and stdout is a parsed contract. Styling is a side benefit.
#
# A table crate (comfy-table) was tried and dropped: for a five-row key/value
# summary every preset drew either an empty header band, a rule between every
# row, or vertical separators. Hand-aligned columns read better and are one
# fewer dependency in a binary that holds a refresh token.
console = "0.16"
minijinja = { version = "2.24", default-features = false, features = [
  "builtins",
  # Required, not optional: `context!` builds a serde value, and without this
  # `Environment::new` is deprecated with "Attempted to instantiate an
  # environment with serde" -- which `-D warnings` turns into a build failure.
  "serde",
] }
serde_yaml = "0.9"

# --- crypto / jwt ---
# jsonwebtoken makes the crypto backend an explicit feature choice (`rust_crypto`
# or `aws_lc_rs`, neither in `default`) and signing PANICS at runtime with neither
# selected. Declare it explicitly rather than relying on another crate in the
# graph enabling it — lightbridge-authz was silently depending on authkestra for
# exactly this. `aws_lc_rs` is used rather than `rust_crypto`: the latter pulls
# the `rsa` crate, which has RUSTSEC-2023-0071 (Marvin attack, no fix released —
# rsa 0.9.10 is the latest) and would fail the SAST advisories gate.
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
# Integration credentials are 256-bit CSPRNG-generated, not human-chosen --
# argon2id/bcrypt exist to slow down brute-forcing *low-entropy* secrets, which
# buys nothing against a uniformly random 256-bit value and only adds real
# latency to every /internal/v1/resolve cache miss (ADR-0006's hot path). SHA-256
# with a direct hash lookup matches lightbridge-authz's ApiKey precedent exactly
# (`crates/lightbridge-authz-rest/src/handlers/mod.rs`) -- decided over argon2id
# for #10, see that PR.
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
hex = "0.4"
# Constant-time comparison for /internal/v1/resolve's shared-secret check
# (#11) -- already a transitive dependency (sha2/rustls pull it in), so this
# adds zero new crates to the supply chain, same as #10's sha2/getrandom/
# base64/hex swap.
subtle = "2"
# governance-auth only: parsing/building the authorization and loopback-
# callback URLs by hand invites the exact query-string bugs a URL parser
# exists to prevent. Already a transitive dependency of reqwest (see
# Cargo.lock), so this is a promotion to direct dependency, not a new crate.
url = "2"

# --- async runtime / http ---
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-stream = { version = "0.1", default-features = false }
axum = { version = "0.8", features = ["macros", "tracing"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
# default-features off + rustls keeps OpenSSL out of the distroless runtime image.
# `form` is governance-auth-only (OAuth2 token-endpoint requests are
# application/x-www-form-urlencoded per RFC 6749) -- reqwest 0.13 gates it
# behind a feature even though it's part of `default`, which we don't use.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "charset", "http2", "stream", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# --- storage: cratestack ONLY (ADR-0009) ---
# Schema-first codegen: `schema/governance.cstack` is the source of truth for the
# tables, the migrations, the CRUD layer and the REST routes. There is no
# hand-written sqlx in this workspace and no hand-written migration; anything
# cratestack's generated CRUD cannot express goes in a schema `procedure`, not in
# a second persistence path.
#
# ⚠️ The family MUST move in lockstep. lightbridge-authz broke `main` by bumping
# some members and not others: 0.4.16's cratestack-core added a
# `TransportStyle::Grpc` variant that the older cratestack-macros did not cover.
# Bump all five together or none.
#
# 0.5.0 is a MINOR bump: it carries a real breaking change
# (cratestack/cratestack#253) that removed the path-addressed relation filter
# free functions (`model::relation::field_op(...)`) — that form was itself an
# exponential-codegen bug (cratestack/cratestack#252, 16-model schemas
# couldn't build). Checked before bumping: this workspace uses none of that
# form, only the chained builder (`model::relation().field().op(...)`), which
# is unaffected — confirmed via
# `grep -rnE "::[A-Za-z_]+_(eq|ne|in_|lt|lte|gt|gte|contains|starts_with|is_null|is_not_null|is_true|is_false|asc|desc)\("`
# across `crates/` and `app/` returning zero matches.
#
# 0.5.1 is a plain patch — cratestack/cratestack#257 only adds a relation-
# connectivity regression test fixture inside cratestack's own test suite
# (closing the coverage gap #253 left: no example or fixture there was
# relation-dense enough to have caught #252 before it shipped). No
# API/schema-surface change.
#
# --- 0.5.1 -> 0.7.10 -------------------------------------------------------
# Two minor bumps' worth of breaking changes were reviewed against this
# workspace before landing. The ones that could have bitten and did not:
#
# - #496 requires a `default-features = false` consumer to name a decimal
#   backend explicitly, on pain of `compile_error!`. We take cratestack's
#   defaults, so this is inert. Money is integer micro-USD (ADR-0008) and no
#   `Decimal` reaches the schema, so #498/#499 are N/A too.
# - #162/#395 changed how `Json` columns are persisted (`Value`'s
#   externally-tagged form wrote `{"Map": {}}` to disk). This schema declares
#   no `Json` field and the live database has no `json`/`jsonb` column, so
#   there is no stored data in the old shape to migrate. Checked, not assumed.
# - #454 made `RequestAuthorizer::authorize` async and #482 moved
#   `ClientStateStore`. We implement neither — only `AuthProvider`.
# - #491 made response content-type negotiation consult what the router can
#   actually encode. `build_router` passes a single `CborCodec`, which is the
#   configuration that bug affected, so this was verified against a running
#   server rather than read: every `Accept` this service can receive returns
#   the same status on 0.7.10 as on 0.5.1. The only change is that a 406 now
#   names CBOR alone instead of claiming the router also serves JSON, which
#   it never could. `/internal/v1/resolve` is a plain axum route and does not
#   go through this negotiation at all.
#
# What this bump also fixes for us: cratestack/cratestack#270 — `apply_pending`
# split migration SQL on every literal `;`, corrupting dollar-quoted plpgsql.
# 0.7.10 sends each migration as one `sqlx::raw_sql` batch, so the workaround
# in `governance-core/src/migrate.rs` (applying the trigger DDL outside the
# tracked migration list) is no longer load-bearing. Left in place for now
# because it is idempotent and removing it is a separate, testable change.
#
# ⚠️ `migrations/postgres/schema.snapshot.json` is still `format_version: 1`.
# #205 bumped the on-disk snapshot to v2 (`projections` instead of `schema`),
# and 0.7.10's `cratestack migrate diff` refuses to read v1 — it errors with
# `missing field 'projections'` rather than silently diffing against an empty
# schema, so nothing can be generated by accident. Applying migrations is
# unaffected: verified on a clone of the live database (no-op, no checksum
# complaint) and from empty (all five apply, producing a schema byte-identical
# to the 0.5.1-built one). Read `docs/adr/0009` and the note in
# `crates/governance-core/migrations/README.md` before regenerating it.
#
# --- 0.7.10 -> 0.8.13 -------------------------------------------------------
# A MINOR bump (0.7 -> 0.8), not the six-patch hop the original sweep assumed —
# 0.7.16 was already stale by the time this landed; 0.8.13 is current. Reviewed
# against cratestack's CHANGELOG for every release in the range. The ones that
# could have bitten and did not:
#
# - 0.8.0 renamed the `Cool*` types to `Cratestack*` (`CoolError` ->
#   `CratestackError`, `CoolContext` -> `CratestackContext`, and the helper
#   `cool_error_from_sqlx` -> `cratestack_error_from_sqlx`). This workspace
#   used all three, so every call site was renamed in the same change. There
#   are no `#[deprecated]` aliases — a hard break in one release, which is why
#   the family must move in lockstep.
# - 0.8.0 made the decimal backend a required `decimal = RustDecimal` argument
#   to `include_server_schema!` whenever a schema declares a `Decimal` field.
#   This schema declares none — money is integer micro-USD (ADR-0008) — so the
#   macro call is unchanged.
# - 0.8.5 removed Protobuf/gRPC support (ADR 0017) and the `TransportStyle::Grpc`
#   variant. We use REST only, so N/A.
# - 0.8.7 rejects field-level `@allow`/`@deny` at parse time. Our `@allow`
#   annotations sit on `mutation procedure` declarations (procedure-level),
#   which are untouched.
# - #550 made `AuthProvider::authenticate` able to read `http::Extensions` by
#   adding a `pub extensions` field to `RequestContext`. Non-breaking for us:
#   we only read `&RequestContext<'_>` inside the `AuthProvider` impl, never
#   construct one.
# - #534 made the `run_in_tx` methods return `RunInTxOutcome<T>` instead of
#   `T`. We use the generated `.run()` path, not `run_in_tx`, so N/A.
# - #491's content-type negotiation was already verified against a running
#   server at 0.7.10 and is unchanged through 0.8.13.
#
# The `schema.snapshot.json` v1 note above still applies — 0.8.x `migrate diff`
# still refuses to read `format_version: 1`, which remains the safe failure.
cratestack-core = "0.8.13"
cratestack-axum = "0.8.13"
# The server facade (schema codegen + sqlx/axum runtime). Renamed to `cratestack`
# because `include_server_schema!` emits `::cratestack::*` paths.
cratestack = { package = "cratestack-pg", version = "0.8.13" }
# CBOR is the wire format for the product API (ADR-0009).
cratestack-codec-cbor = "0.8.13"
# JSON is retained for ONE reason: Authorino's `metadata.http` step posts and
# parses `application/json` and cannot be taught CBOR, so `/internal/v1/resolve`
# must speak JSON. Do not use it for the product API.
cratestack-codec-json = "0.8.13"

# ⚠️ `default-features = false` is load-bearing, not tidiness. The default
# feature set includes `rustls`, which resolves to
# aws-smithy-http-client/legacy-rustls-ring -> rustls 0.21 -> rustls-webpki
# 0.101.7, which carries RUSTSEC-2026-0098/0099/0104 (name-constraint bypasses
# and a reachable panic in CRL parsing). `default-https-client` takes the modern
# rustls-aws-lc path instead. The other four features are the remainder of the
# default set, restated so nothing else is silently dropped.
aws-sdk-s3 = { version = "1", default-features = false, features = ["sigv4a", "http-1x", "rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest"] }

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "tokio"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
tracing-opentelemetry = "0.33"
prometheus = "0.14"

# --- errors / config / misc ---
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
cuid = { version = "2", default-features = false, features = ["v2"] }
moka = { version = "0.12", features = ["future"] }
utoipa = { version = "5", features = ["macros", "chrono"] }
mimalloc = "0"

# ─────────────────────────────────────────────────────────────────────────────
# Lints. Levels live here; the knobs individual lints read live in clippy.toml.
#
# ⚠️ CI runs `cargo clippy --all-targets --all-features -- -D warnings`, so in
# this repo there is NO soft tier: `warn` and `deny` both fail the build. Every
# level below was therefore MEASURED at zero violations before being set, not
# copied from a template. If you add a lint here, measure it first —
# `cargo clean -p <crate>` beforehand, because a cached clippy run reports clean
# without having looked.
#
# `clippy::pedantic` is deliberately NOT enabled wholesale: it has real hits
# here (4 `doc_markdown`) and, under `-D warnings`, blanket-enabling it would
# break the build rather than advise. Selected pedantic lints are listed
# individually below instead.
# ─────────────────────────────────────────────────────────────────────────────
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

# No `unsafe` in this tree today. This service holds an S3 credential and a
# GitHub App key; keep adding `unsafe` a deliberate, reviewable act.
unsafe_code = "deny"

unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
# correctness + suspicious + style + complexity + perf. Zero violations today,
# so this is a real gate from day one.
all = { level = "deny", priority = -1 }

# Apollo §2.3's table, each verified at zero here.
redundant_clone = "deny"
needless_borrow = "deny"
map_unwrap_or = "deny"
manual_ok_or = "deny"
large_enum_variant = "deny"
unnecessary_wraps = "deny"
clone_on_copy = "deny"
needless_collect = "deny"

# Apollo §4.1/§4.2: no panicking in shipping code. Tests are exempted via the
# `allow-*-in-tests` knobs in clippy.toml, which is the guide's own carve-out.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# Hygiene.
dbg_macro = "deny"
missing_safety_doc = "deny"
empty_docs = "deny"
indexing_slicing = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ADORSYS-GIS/lightbridge-governance"
# These crates are deployed as one container image, never published to
# crates.io. Also what lets cargo-deny's `allow-wildcard-paths` apply to the
# intra-workspace path dependencies -- it deliberately does not exempt crates
# that claim to be publishable.
publish = false

# Deliberately not the same as `[profile.release]` (cargo defaults: opt-level 3,
# codegen-units 16, no LTO) — that stays cheap for local/CI `--release` runs. `prod`
# is what `.docker/Dockerfile` actually builds, so it's the one place paying extra
# build cost for a smaller binary is worth it.
#
# Already on `lto = "thin"` rather than fat here, which is good — fat LTO measured
# ~1.5-2.3x the peak build RAM of thin for a meaningfully smaller binary on
# cratestack-pg's own release pipeline (cratestack/cratestack#250). `codegen-units = 1`
# on top of thin LTO still forces single-unit optimization though, which mainly costs
# memory/time without much further size win once LTO itself is already merging things
# — worth re-measuring locally (`cargo build --profile prod` with/without this line) to
# confirm it's still earning its keep here, since it wasn't verified as part of that PR.
[profile.prod]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true
