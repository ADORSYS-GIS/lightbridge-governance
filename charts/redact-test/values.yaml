# Local k3d deployment for redact-extproc testing
#
# This deploys a minimal Envoy gateway with ext_proc filter to test
# the redact-extproc sidecar locally.
#
# Usage:
#   kubectl k3d kubeconfig get redact-cluster > /tmp/k3d-kubeconfig
#   export KUBECONFIG=/tmp/k3d-kubeconfig
#
#   helm upgrade --install core-gateway ./charts/redact-test/ -n envoy-gateway-system
#

# Namespace for the gateway
namespace: envoy-gateway-system

# The upstream AI provider
provider:
  baseUrl: https://api.ai.camer.digital

# Redaction settings
redact:
  profile: coding-assistant
  hashSalt: local-test-salt

# Sidecar image (built locally via docker compose)
sidecar:
  image: localhost:5000/redact-extproc:latest
  pullPolicy: Never

# Disable things not needed for local testing
certManager:
  enabled: false

externalSecrets:
  enabled: false

serviceMonitor:
  enabled: false