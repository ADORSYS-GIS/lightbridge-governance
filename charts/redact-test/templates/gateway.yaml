# Envoy Gateway + redact-extproc sidecar deployment
#
# This replicates the production Envoy gateway architecture locally.
#
# Data flow:
#   client -> Envoy (:8080) -> ext_proc gRPC -> redact-extproc (:9500) -> scan -> Envoy forwards -> upstream AI provider
#
# Key points:
#   - redact-extproc runs as sidecar, receives gRPC via loopback only
#   - Envoy blocks all traffic until ext_proc responds (fail_closed)
#   - ext_proc scans request body before Envoy forwards it upstream

apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
# Configuration for redact-extproc sidecar
apiVersion: v1
kind: ConfigMap
metadata:
  name: redact-extproc-config
  namespace: {{ .Values.namespace }}
data:
  REDACT_PROFILE: {{ .Values.redact.profile }}
  REDACT_HASH_SALT: {{ .Values.redact.hashSalt }}
  RUST_LOG: info,json
---
# Envoy Gateway with redact-extproc sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: core-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-gateway
  template:
    metadata:
      labels:
        app: core-gateway
      annotations:
        # Tell Envoy to use buffered mode for requests, streamed for responses
        feature.expedia.com/ext-proc-mode: "request:buffered,response:streamed"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # ── Envoy Gateway (entry point for all clients) ──────────────────────
        - name: gateway
          image: docker.io/envoyproxy/envoy:v1.32.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Envoy needs some writable paths
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - /usr/local/bin/envoy
            - --component-log-level
            - "ext_proc:debug,grpc:debug"
            - --config-yaml
            - |
              static_resources:
                listeners:
                  - name: main
                    address:
                      socket_address:
                        address: 0.0.0.0
                        port_value: 8080
                    filter_chains:
                      - filters:
                          - name: envoy.filters.network.http_connection_manager
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                              codec_type: AUTO
                              stat_prefix: gateway
                              route_config:
                                name: local_route
                                virtual_hosts:
                                  - name: upstream
                                    domains: ["*"]
                                    routes:
                                      - match:
                                          prefix: "/"
                                        route:
                                          cluster: upstream
                              http_filters:
                                # ext_proc filter - calls redact-extproc sidecar via gRPC
                                - name: envoy.ext_proc
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                                    grpc_service:
                                      envoy_grpc:
                                        cluster_name: redact-extproc
                                    processing_mode:
                                      request_body_mode: BUFFERED
                                      response_body_mode: STREAMED
                                    failure_mode_allow: false
                                - name: envoy.filters.http.router
                                  typed_config:
                                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                clusters:
                  # redact-extproc sidecar gRPC endpoint (loopback)
                  - name: redact-extproc
                    type: STRICT_DNS
                    lb_policy: ROUND_ROBIN
                    connect_timeout: 5s
                    load_assignment:
                      cluster_name: redact-extproc
                      endpoints:
                        - lb_endpoints:
                            - endpoint:
                                address:
                                  socket_address:
                                    address: 127.0.0.1
                                    port_value: 9500
                  # Upstream AI provider cluster
                  - name: upstream
                    type: STRICT_DNS
                    lb_policy: ROUND_ROBIN
                    connect_timeout: 30s
                    load_assignment:
                      cluster_name: upstream
                      endpoints:
                        - lb_endpoints:
                            - endpoint:
                                address:
                                  socket_address:
                                    address: {{ .Values.upstream.host }}
                                    port_value: {{ .Values.upstream.port }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

        # ── redact-extproc (sidecar - Envoy calls it via loopback) ─────────────
        # This is the scanning component. Envoy sends requests here for
        # inspection before forwarding to upstream.
        - name: redact-extproc
          image: {{ .Values.sidecar.image }}
          imagePullPolicy: {{ .Values.sidecar.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: redact-extproc-config
          env:
            - name: LISTEN_ADDR
              value: "127.0.0.1:9500"
            - name: METRICS_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.metrics.port }}"
            - name: RESPONSE_HOLD_BACK_BYTES
              value: "{{ .Values.redact.holdBackBytes }}"
          ports:
            - name: extproc
              containerPort: 9500
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.metrics.port }}
            initialDelaySeconds: 2
            periodSeconds: 10
---
# Service: clients connect here
apiVersion: v1
kind: Service
metadata:
  name: core-gateway
  namespace: {{ .Values.namespace }}
  labels:
    app: core-gateway
spec:
  type: LoadBalancer
  selector:
    app: core-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP