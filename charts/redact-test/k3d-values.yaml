# Redact-extproc + Envoy Gateway Local Test Setup
#
# Deploys Envoy gateway with redact-extproc sidecar for local k3d testing.
#
# Data flow:
#   client -> Envoy (:8080) -> ext_proc -> redact-extproc (:9500) -> upstream
#
# Usage:
#   # Get kubeconfig
#   kubectl k3d kubeconfig get redact-cluster > /tmp/k3d.yaml
#   export KUBECONFIG=/tmp/k3d.yaml
#
#   # Deploy
#   helm upgrade --install core-gateway ./charts/redact-test/ \
#     -n envoy-gateway-system \
#     --create-namespace \
#     -f ./charts/redact-test/k3d-values.yaml
#
#   # Test
#   curl http://localhost:8080/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -H "Authorization: Bearer $API_KEY" \
#     -d '{"model":"...","messages":[{"role":"user","content":"hello"}]}'

# Namespace for all components
namespace: envoy-gateway-system

# Upstream AI provider
# Use the internal test-echo service in k3d for basic testing
upstream:
  host: test-echo.envoy-gateway-system.svc.cluster.local
  port: 80

# Redaction configuration
redact:
  profile: coding-assistant
  hashSalt: local-test-salt
  holdBackBytes: 4096

# Image for redact-extproc sidecar
# Built locally via: docker compose --profile redact build
sidecar:
  image: redact-extproc:latest
  pullPolicy: Never

# Enable metrics (optional)
metrics:
  enabled: true
  port: 9501