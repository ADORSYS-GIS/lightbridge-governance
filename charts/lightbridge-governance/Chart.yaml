apiVersion: v2
name: lightbridge-governance
description: |
  The AI governance platform: a tenant/application/integration registry plus two
  connectors -- GitHub Copilot (pull, RFC-0001) and Microsoft Foundry (push over
  OTLP, RFC-0002).

  Renders the API Deployment, the copilot-sync CronJob and the ServiceMonitor,
  plus (copilotOtel.enabled, default true) a dedicated OpenTelemetryCollector
  CR that bridges copilot-sync's push-based OTLP metrics into this platform's
  pull-based scrape model for Alloy/Mimir. The OTLP collector for Foundry is
  a separate OpenTelemetryCollector CR (not this one).

  Published to OCI on merge and consumed by ai-helm, matching the
  lightbridge-authz convention (charts live with the code that they deploy).
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - governance
  - copilot
  - foundry
  - otlp
maintainers:
  - name: adorsys-gis
dependencies:
  - name: app-template
    version: 4.6.2
    repository: https://bjw-s-labs.github.io/helm-charts
