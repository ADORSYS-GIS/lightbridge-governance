# Structural defaults only. Deployed values live in ai-helm-values
# (environments/<env>/values/lightbridge-governance.yaml) -- values-repo-FIRST:
# the file must exist on main before the ai-helm change merges, or
# ignoreMissingValueFiles silently falls back to these defaults.
name: lightbridge-governance

# RBAC for TokenReview-based caller authentication on /internal/v1/resolve
# (ADR-0017). When enabled, creates a ClusterRole granting `create` on
# `tokenreviews.authentication.k8s.io` and binds it to the governance pod's
# ServiceAccount.
rbac:
  enabled: true

# Comma-separated list of permitted ServiceAccount identities that may call
# `/internal/v1/resolve` (ADR-0017). Authorino's own SA must be in this list.
# Each entry is in `namespace/name` format.
allowedServiceAccounts: "authorino/authorino"

# ADR-0057: deployment-specific (the CNPG cluster's Service DNS name, the
# database name) -- empty here, supplied per-environment in ai-helm-values.
# Only the PASSWORD is a secret (externalSecret.dbPasswordProperty, below);
# everything else is a known, non-secret literal, so there is nothing for an
# operator to "assemble" -- set this to
#   postgresql://governance:$(DB_PASSWORD)@<cnpg-rw-service>:5432/governance
# and Kubernetes' native $(VAR_NAME) substitution (resolved by the kubelet
# from the DB_PASSWORD env var defined earlier in the same container's env
# list, NOT visible in `kubectl get pod -o yaml`) fills in the password at
# container start. Same technique lightbridge-code-intelligence's
# DATABASE_URL already uses in ai-helm-values. `image`/`api` top-level keys
# from the pre-app-template-v4 chart are gone -- the equivalent settings now
# live under `app-template.controllers.api` below.
#
# ⚠️ MUST live under `global`, not as a plain top-level key: DATABASE_URL's
# embedded `$(DB_PASSWORD)` reference only expands correctly if it is a
# literal `env` list entry (Kubernetes never expands `$(VAR_NAME)` inside an
# `envFrom`- or `valueFrom`-sourced value, only inside a plain `value:`
# string -- see the DB_PASSWORD/DATABASE_URL pair in
# `app-template.controllers.*.containers.main.env` below), which forces this
# through app-template's env-string `tpl` pass rather than the ConfigMap
# technique `templates/configmap-copilot.yaml` uses for TENANT_ID/GH_ORG/etc.
# `tpl` there runs against app-template's OWN scoped context, where
# `.Values` is limited to `app-template.*` plus `global.*` -- a plain
# top-level key like the old `databaseUrl` would render as empty inside that
# env string regardless of what a deployed override set it to. `global.*` is
# the one path Helm propagates into every subchart unchanged, so it is the
# only key path that actually reaches the container.
#
# ⚠️ THE DEPLOYED VALUE MUST MATCH: ai-helm-values' own
# environments/<env>/values/lightbridge-governance.yaml must set
# `global.databaseUrl`, not a bare top-level `databaseUrl` -- confirm this
# before relying on a deployed override, the same values-repo-FIRST caution
# as the top of this file.
global:
  databaseUrl: ""

# GitHub publishes daily; six-hourly with a 3-day lookback means a late report is
# picked up without operator action.
copilot:
  # The deployment's single tenant (ADR-0001). Lands in every row and every
  # WHERE clause across every table.
  #
  # ⚠️ This was `""` and the deployment ran that way, ingesting real Copilot
  # data stamped `tenant_id = ''`. Nothing complained: `env::var` returns
  # Ok("") for a set-but-empty variable and clap counts a required arg as
  # satisfied by an empty value, so all the "required" markers said present.
  # Both binaries now REFUSE an empty value at startup rather than write data
  # addressed to nobody -- so leaving this empty is a loud CrashLoopBackOff,
  # not silent bad data.
  #
  # Defaulted to the org rather than left empty so a deployment that forgets
  # to override still runs coherently. Override in ai-helm-values if this
  # deployment's tenant should be named something else.
  #
  # ⚠️ CHANGING IT LATER IS NOT FREE. `high_water_mark` is itself
  # tenant-scoped, so a new tenant has no manifests, reads as a cold start,
  # and re-backfills the full 28-day window under the new id. That is the
  # good news for the `''` rows already written -- they do not need
  # hand-migrating, the next run repopulates everything under the real tenant
  # -- but it does mean the old rows linger as orphans no scoped query will
  # ever return. Decide the value once.
  tenantId: adorsys-gis
  org: adorsys-gis
  s3:
    # Raw report archive: the shared Hetzner Object Storage bucket, same
    # material as LibreChat and the CNPG backups (creds via ExternalSecret,
    # keys under externalSecret.s3RemoteKey). Prefix copilot-governance/raw/.
    bucket: ssegning-k8s-state
    endpoint: https://nbg1.your-objectstorage.com
    region: us-east-1
    forcePathStyle: "true"
  # OTLP metrics receiver for the push-based collector metrics (#12 AC
  # "operational metrics"). 4317 is the OTLP/gRPC receiver port.
  #
  # This is now a MANUAL/EXTERNAL OVERRIDE, not the primary wiring: by
  # default (copilotOtel.enabled: true, below) copilot-sync is pointed at
  # the dedicated in-cluster collector automatically -- see
  # templates/configmap-otlp.yaml, which computes the effective endpoint and
  # only falls back to this host when copilotOtel.enabled is false. Leave
  # this empty unless you specifically want to bypass the bundled collector
  # and push straight to some other OTLP/gRPC receiver (e.g. a real Alloy
  # endpoint reachable by FQDN). Empty host (with copilotOtel also disabled)
  # = no env var and no egress; the push is skipped (and, when set, a failed
  # push is a WARN, never a run failure).
  #
  # Wired to the copilot-sync container via envFrom on the local `otlp` ConfigMap
  # below (templates/configmap-otlp.yaml), not a plain templated env value:
  # Helm values files are never templated, so a value string can't be made to
  # disappear from an `app-template` env map based on this setting -- it would
  # always render OTEL_EXPORTER_OTLP_ENDPOINT, just empty when host is unset.
  # Present-but-empty is not "no env var and no egress". The optional
  # configMapRef gives the same "absent when unset" behaviour instead.
  otlp:
    host: ""
    port: "4317"

# Dedicated push -> pull bridge for copilot-sync's operational OTLP metrics.
#
# ADR-0007 is explicit that metrics on this platform are pull-based: Alloy
# discovers ServiceMonitor/PodMonitor CRDs cluster-wide and remote-writes to
# Mimir, and "OTLP to Alloy carries traces, not first-party metrics" -- with
# the ADR itself naming the reason why a CronJob can't just push and be done:
# "a CronJob pod that exits cannot be scraped". copilot-sync does exactly
# that (one force_flush, then the pod dies), so this OpenTelemetryCollector
# CR sits in between and turns the one-shot push into something Alloy can
# pull continuously, without contradicting ADR-0007's decision -- it doesn't
# reintroduce a pushgateway or a second copy of `governance_connector_*` (the
# API still owns those, derived from ingest_manifest); it only carries what
# copilot-sync emits about its OWN run (duration, records processed, etc.):
#
#   copilot-sync --OTLP/gRPC:4317--> collector --prometheus exporter--> ServiceMonitor --> Alloy --> Mimir
#
# Requires the OpenTelemetry Operator to be installed on the cluster
# (confirmed present; not something this chart can verify at render time).
copilotOtel:
  enabled: true
  replicas: 1
  # Core `otelcol` distribution, NOT `-contrib`: verified against
  # open-telemetry/opentelemetry-collector-releases'
  # distributions/otelcol/manifest.yaml that otlpreceiver, resourceprocessor
  # and prometheusexporter -- everything this pipeline's `config` uses below
  # (templates/otelcollector.yaml) -- all ship in core. No need for the much
  # larger contrib image just for this three-component pipeline.
  image: "otel/opentelemetry-collector:0.158.0"
  resources:
    # A push->pull bridge for one CronJob's small burst of gauges/counters
    # every 6h -- not a fleet-wide collector. Sized accordingly.
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  # Listen port for the prometheus exporter (templates/otelcollector.yaml);
  # duplicated there and in templates/ciliumnetworkpolicy-copilot-otel.yaml
  # since values.yaml can't be referenced from itself or from another
  # values key -- both sites are commented at point of use.
  prometheusPort: 8889
  # THE STALENESS TRAP: the CronJob schedules (app-template.controllers.
  # copilot-sync.cronjob.schedule, below, is `0 */6 * * *` -- every 6h; the
  # copilot-verify CronJob pushes its drift/unmapped gauges daily at 03:30)
  # and each copilot-sync run does one `force_flush` then the pod dies. The
  # prometheus exporter's own default (metric_expiration: 5m) would make every
  # series vanish from /metrics ~5 minutes after each run -- no stale marker,
  # no zero, just gone -- so a dashboard would read empty ~99% of the time and
  # a "no data for N minutes" freshness alert could never fire (no data is not
  # the same signal as stale data).
  #
  # 30h = 5 x the 6h schedule interval: survives 4 FULLY missed runs back to
  # back (24h -- e.g. a stuck ExternalSecret sync, a GitHub outage that fails
  # every attempt, a node-drain window) plus one extra interval of slack for
  # the CronJob's own `startingDeadlineSeconds: 900` skew, while still
  # eventually expiring -- so a pipeline that's actually been dead for days
  # reads as *missing* at /metrics, not as a silently-stale number from a
  # week ago quietly passing as "fine". The daily copilot-verify push (24h
  # gap between runs) also stays well inside this window.
  metricExpiration: 30h

serviceMonitor:
  enabled: true
  interval: 30s

# Alerting rules over the two ALERT-GRADE metric families (templates/
# prometheusrule.yaml). Deliberately none over `governance_copilot_*`, which
# ADR-0011 classes as dashboard-grade -- it lives in the collector's memory and
# a restart blanks it for up to 6h.
prometheusRule:
  enabled: true

  # ⚠️ TWO WAYS THIS SILENTLY DOES NOTHING, both worth checking before
  # trusting any alert below.
  #
  # 1. Prometheus/Mimir selects rules by LABEL (`ruleSelector`). Wrong labels
  #    and the resource applies cleanly, shows up in `kubectl get
  #    prometheusrule`, and is never evaluated -- no error anywhere. Exactly
  #    how the Grafana dashboard's `instanceSelector` failed. Copy from a rule
  #    already evaluating on this cluster:
  #      kubectl get prometheusrule -A --show-labels
  #
  # 2. ADR-0007 says Alloy discovers ServiceMonitor/PodMonitor and
  #    remote-writes to Mimir. Alloy does NOT evaluate rules -- Mimir's ruler
  #    does. If this cluster feeds its ruler some other way (a Mimir bucket, a
  #    mimir-rules ConfigMap), a PrometheusRule CR is inert here whatever its
  #    labels, and these expressions need lifting into that mechanism instead.
  #
  # NOT VERIFIED against the deployed cluster -- no PrometheusRule existed
  # anywhere in this repo before this, so there was no convention to copy.
  additionalLabels: {}

  # Empty = the release namespace, matching templates/servicemonitor.yaml.
  # Set it if the ruler only watches a specific namespace.
  namespace: ""

  thresholds:
    # Freshness. 36h/72h are the numbers docs/runbooks/copilot-sync-failed.md
    # already names, so the alert and the runbook agree. Both are generous
    # against the 6h schedule: several consecutive failed runs before anyone
    # is woken.
    syncStaleHours: 36
    syncVeryStaleHours: 72

    # Month-to-date spend ceiling, in INTEGER micro-USD (ADR-0008 -- no float
    # ever touches a monetary value, and PromQL does the display division).
    # 5_000_000_000 micro-USD = $5,000. Set this to something meaningful for
    # the deployment; the default is a placeholder, not a considered budget.
    monthlySpendMicroUsd: 5000000000

    # Seats assigned that have never once been used. Tune to the seat count --
    # 20 is meaningless for a 15-seat org. A ratio works better where seat
    # counts vary:
    #   governance_org_seats_never_used / governance_org_seats_assigned > 0.3
    seatsNeverUsed: 20

    # Active-user drop, compared against the SAME WEEKDAY rather than
    # yesterday. Copilot usage is strongly weekday-seasonal: a Saturday is
    # legitimately far below a Friday, so `offset 1d` would page every weekend
    # and be muted within a fortnight. 0.7 = fire below 70% of the comparison
    # point.
    activeUsersDropRatio: 0.7
    activeUsersCompareOffset: 7d

# Ships dashboards/copilot-connector.json to Grafana as a GrafanaDashboard CR
# (templates/grafanadashboard.yaml), per ADR-0003's precedent (ai-helm
# ADR-0063's read-only-Postgres-datasource pattern for Grafana Operator
# resources) -- not a sidecar-labelled ConfigMap. See that template's header
# comment for the apiVersion/kind verification and the datasource-UID
# substitution mechanism in full; this block only carries the values.
grafanaDashboard:
  enabled: true

  # The namespace the GrafanaFolder/GrafanaDashboard CRs are created in --
  # NOT the release namespace, deliberately.
  #
  # Observed convention on the deployed cluster (2026-08-07): every Grafana
  # resource already lives alongside Grafana itself in `observability`, and
  # every one of them reconciles cleanly --
  #   $ kubectl get grafanafolder -A
  #   NAMESPACE       NAME            NO MATCHING INSTANCES   LAST RESYNC
  #   observability   ai-gateway                              2m17s
  #   observability   applications                            2m17s
  #   observability   collectors                              2m17s
  #   observability   lightbridge                             8m25s
  #   ... (7 folders, all in observability, none unmatched)
  # `GrafanaFolder` defaults to same-namespace-only matching just as
  # `GrafanaDashboard` does, so those folders reconciling at all proves the
  # `Grafana` CR is in `observability` too.
  #
  # Co-locating is why the platform's existing resources never needed
  # `allowCrossNamespaceImport`. Matching that convention rather than reaching
  # across namespaces keeps this chart consistent with everything already
  # deployed.
  #
  # ⚠️ Whatever applies this chart (ArgoCD) must be permitted to create
  # resources in this namespace. Seven folders already live there via some
  # mechanism, so that permission almost certainly exists -- but an apply
  # failing on RBAC rather than on the manifest is the tell.
  namespace: observability

  # Lets the operator match a `Grafana` CR in ANOTHER namespace. Now defaults
  # to FALSE (the operator's own default), because with `namespace` above
  # putting these CRs in `observability` alongside Grafana, same-namespace
  # matching is exactly what we want and cross-namespace import is not needed.
  #
  # Kept as an escape hatch for a deployment that puts these CRs somewhere
  # else. If you set `namespace` to the release namespace, you almost
  # certainly need this to be true.
  #
  # The failure mode when this is wrong is genuinely misleading, and was hit
  # on this deployment on 2026-08-07 (CRs in the app namespace, Grafana in
  # `observability`, flag absent so defaulting false):
  #
  # The failure mode when this is wrong is genuinely misleading, and was hit
  # on this deployment on 2026-08-07:
  #
  #   status.NoMatchingInstances: true
  #   reason: EmptyAPIReply
  #   message: "None of the available Grafana instances matched the selector,
  #             skipping reconciliation"
  #
  # It blames the *selector*, so the obvious move is to go hunting for a label
  # typo -- but the operator emits exactly this when the labels are correct
  # and the only matching Grafana simply lives elsewhere. `EmptyAPIReply`
  # means zero candidate instances were even considered, not that one was
  # considered and rejected.
  #
  # Set to true only if these CRs are deployed somewhere other than the
  # namespace Grafana runs in.
  allowCrossNamespaceImport: false

  # A dedicated Grafana folder for the Copilot dashboards, matching the
  # per-domain folders already on the cluster (ai-gateway, applications,
  # collectors, lightbridge, model-serving, my-usage, platform).
  #
  # `metadata.name` must be k8s-safe; `spec.title` is what a human sees in
  # Grafana's folder list, and defaults to metadata.name when omitted -- so it
  # is set explicitly here rather than accepting a hyphenated slug as the
  # display name.
  #
  # The dashboard is placed into it via `spec.folderRef`, which references a
  # GrafanaFolder CR BY NAME and requires it to be in the SAME namespace as
  # the dashboard -- both are created in `namespace` above, so that holds.
  # (`folderRef` and `folderUID` are mutually exclusive, and either one makes
  # the operator ignore the older plain-title `folder` field.)
  folder:
    enabled: true
    # Suffix on the release name, so the CR is `<name>-copilot`.
    nameSuffix: copilot
    title: "Copilot"

    # The Copilot folder is nested under a `Governance` parent, so all
    # governance dashboards group together as this platform grows past the
    # Copilot connector (Foundry, redaction, and the business/adoption panels
    # ADR-0003 puts in SQL all belong under the same roof).
    #
    # Nesting uses `spec.parentFolderRef`, which references a GrafanaFolder CR
    # BY NAME in the SAME namespace -- both are created in
    # grafanaDashboard.namespace, so that holds. Only one of
    # `parentFolderRef` / `parentFolderUID` may be set; this chart uses the ref
    # so the parent is resolved by the operator rather than by pasting a UID
    # that only exists after the parent has reconciled once.
    parent:
      # Whether THIS chart creates the parent folder.
      #
      # True today because no `governance` folder exists on the cluster yet --
      # the deployed set is ai-gateway, applications, collectors, lightbridge,
      # model-serving, my-usage, platform.
      #
      # ⚠️ Set this to false if another chart starts owning the same parent.
      # Two releases both creating a GrafanaFolder with this `name` in this
      # namespace is a genuine conflict -- whichever applies last wins, and on
      # ArgoCD they will fight over it indefinitely. Referencing beats
      # co-creating once more than one chart wants the folder.
      create: true
      # The parent CR's metadata.name. Short and domain-shaped, matching the
      # existing folders' convention rather than the release name.
      name: governance
      title: "Governance"

  # Grafana Operator v5 requires every GrafanaDashboard to carry an
  # instanceSelector (a label selector) so it knows which deployed `Grafana`
  # CR to push the dashboard into. That `Grafana` CR lives in ai-helm, a
  # private repo THIS CHART CANNOT SEE OR VERIFY -- get this wrong and the
  # GrafanaDashboard CR renders and applies cleanly, but the operator simply
  # never selects it, so the dashboard never appears in Grafana. No error
  # anywhere: `kubectl get grafanadashboard` shows the CR as applied, and
  # there is nothing to grep in its status that says "no Grafana matched"
  # unless you know to check `status.conditions` on the CR itself.
  #
  # ⚠️ `dashboards: "grafana-external"`, NOT the operator's documented
  # quick-start default of `dashboards: "grafana"`. This chart shipped the
  # quick-start value first and the dashboard silently never appeared.
  #
  # Read off a folder that is demonstrably reconciling on the deployed
  # cluster, so this is copied rather than guessed:
  #   $ kubectl get grafanafolder lightbridge -n observability \
  #       -o jsonpath='{.spec.instanceSelector}'
  #   {"matchLabels":{"dashboards":"grafana-external"}}
  #
  # Re-run that against any healthy folder if this ever stops matching -- it
  # is the one selector known to work, and inventing a plausible-looking value
  # instead is precisely how the first attempt failed.
  #
  # ⚠️ IMMUTABLE on both GrafanaDashboard and GrafanaFolder. Changing it means
  # DELETING and recreating the CRs; `kubectl apply` of a changed selector is
  # rejected. If the CRs are already deployed with the wrong selector, bumping
  # this value alone will not fix them.
  instanceSelector:
    matchLabels:
      dashboards: "grafana-external"

  # Datasource UIDs the dashboard JSON references, substituted into
  # dashboards/copilot-connector.json at `helm template` time (Helm-side
  # string replace over literal placeholder tokens -- see
  # templates/grafanadashboard.yaml for why this was chosen over the
  # operator's own spec.datasources mapping field, and for what happens if a
  # value here is wrong). Contract with the dashboard-JSON generator: the
  # tokens are exactly `__DS_POSTGRES__` and `__DS_PROMETHEUS__`, used as the
  # literal `uid` value of any Postgres/Prometheus datasource reference in
  # that file.
  datasources:
    # ADR-0003, stated explicitly: "Expose the governance database to
    # Grafana as a read-only Postgres GrafanaDatasource (uid: governance)".
    # High confidence -- this is a pinned decision, not a guess.
    postgresUid: governance
    # NOT specified anywhere in this repo. Prometheus/Mimir datasource UIDs
    # are assigned by whatever provisioned the GrafanaDatasource CR for
    # Mimir in ai-helm (or by Grafana's own default-datasource
    # provisioning), and this chart has no way to discover or verify it.
    # "mimir" is a reasonable guess given this platform's metrics backend
    # (ADR-0003/ADR-0007/ADR-0011 all name Mimir), NOT a confirmed value --
    # CONFIRM AGAINST THE DEPLOYED GRAFANA before trusting any panel that
    # reads governance_copilot_*/governance_connector_* series. A wrong UID
    # here does not fail to render or fail loudly: it ships a dashboard
    # whose time-series panels silently show "Datasource not found" or an
    # empty graph -- indistinguishable at a glance from "no data yet",
    # exactly the ambiguity ADR-0011 already warns about for
    # governance_copilot_*'s own 30h expiration cliff.
    prometheusUid: mimir

# Cilium egress for the copilot-sync CronJob: DNS, api.github.com, the pinned
# copilot-reports.github.com signed-download host (spike-0007), the S3
# archive and (when copilotOtel.enabled) the in-cluster OTLP collector.
# Scoped to the CronJob pods via the component label; the API Deployment's
# egress is untouched.
#
# `otlpNamespace` is the redact-gateway precedent
# (charts/redact-gateway/templates/ciliumnetworkpolicy.yaml) for reaching
# Alloy: same value, same `k8s:app.kubernetes.io/name: alloy` selector,
# reused in templates/ciliumnetworkpolicy-copilot-otel.yaml for the
# collector's own ingress-from-Alloy rule.
# Public OTLP ingest for developer AI clients (Claude Code, Codex, GitHub
# Copilot in VS Code), all pointed here by `governance-auth` (ADR-0010).
# A SEPARATE collector from copilotOtel above -- see the header comment in
# templates/otelcollector-ai-cli.yaml for the four measured reasons why
# reusing that one doesn't work.
aiCliOtel:
  # Off by default: this opens a PUBLIC endpoint, so turning it on is an
  # explicit act in the values repo, not something a chart bump does.
  enabled: false
  # Public ingest for a whole developer fleet, so unlike copilotOtel's single
  # CronJob bridge this wants more than one replica -- a restart with one
  # replica drops every in-flight export.
  replicas: 2
  # `-contrib`, NOT the core distribution copilotOtel uses: `oidcauthextension`
  # ships only in contrib. Verified by running the rendered config under this
  # exact image -- the oidc extension started against the real issuer, and
  # unauthenticated and malformed-token POSTs both returned 401.
  image: "otel/opentelemetry-collector-contrib:0.158.0"
  # Init container that retry-loops OIDC discovery before the collector
  # starts -- see the `initContainers` block in otelcollector-ai-cli.yaml for
  # why this exists (a real prod incident: 0/2 replicas, 100% CrashLoopBackOff,
  # ai-helm-values#216). Pinned by tag, same convention as `image` above --
  # digest captured at the time this was written:
  # curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
  initContainerImage: "curlimages/curl:8.11.1"
  # Human-readable name for this collector, used in the CiliumNetworkPolicy's
  # `spec.description`. Only prose -- nothing selects on it.
  displayName: AI-CLI
  # The `governance.source` resource attribute every span/metric/log through
  # this collector is stamped with, so laptop telemetry is distinguishable from
  # in-cluster telemetry -- and, now that there is more than one public
  # collector, so is one client fleet from another. RFC-0003 §2 matrix row
  # name, lowercased, matching `microsoft-foundry`'s existing convention.
  sourceAttribute: ai-cli
  # memory_limiter runs first in every pipeline; these are its bounds.
  memoryLimiterMib: 400
  memorySpikeLimitMib: 100
  # Alloy is this cluster's fan-out to Tempo/Loki/Mimir (ADR-0007), so this
  # collector needs one exporter and no knowledge of the backends.
  alloyEndpoint: "alloy.observability.svc.cluster.local:4317"
  oidc:
    # The lightbridge-authz issuer -- it already serves OIDC discovery and JWKS
    # publicly (both confirmed 200), so the collector validates callers itself
    # with no Authorino involvement. UNCHANGED: callers now present a token
    # authz MINTED, via RFC 8693 token-exchange, rather than a long-lived API
    # key -- but the signing issuer is the same either way.
    issuerUrl: "https://auth.ai.camer.digital"
    # ⚠️ This is a CLIENT ID, not a service name, and that is not cosmetic.
    #
    # `governance-auth` exchanges its Keycloak token at authz's /oauth2/token
    # (lightbridge-governance#84). Per lightbridge-authz ADR-0011 Decision 5 the
    # minted token's `aud`/`azp` are ALWAYS exactly the requesting `client_id` --
    # `TokenExchangeOpStore::handle_token_exchange` never reads the RFC 8693
    # `audience` request parameter (zero occurrences in that file), so a client
    # cannot ask for a different one. Verified against a live exchange: HTTP 200,
    # `aud: governance-auth-cli`. So this value MUST equal the `client_id`
    # registered in authz's `oauth2.clients`, and changing one without the other
    # silently 401s every push.
    #
    # ⚠️ CONSEQUENCE, accepted deliberately (lightbridge-governance#84 AC 4):
    # narrowing to this audience means the static `--otel-token` path -- a
    # long-lived lightbridge-authz API key, which carries `aud:
    # lightbridge-api-key` -- is NO LONGER accepted here. That is the credential
    # Codex and VS Code Copilot use, because neither has a credential-helper hook
    # for OTLP headers. Restoring them needs a second receiver/oidc extension
    # trusting `lightbridge-api-key`, tracked separately. Claude Code is
    # unaffected: `otelHeadersHelper` re-invokes `governance-auth otel headers`
    # on an interval, so a short-lived exchanged token is the right credential
    # there -- which is why the previous "no client has a refresh hook, so use
    # 120d API keys" reasoning no longer holds.
    audience: "governance-auth-cli"
  ingress:
    enabled: true
    # Traefik, not the Envoy core-gateway: otel.<domain> already resolves to
    # the Traefik LB via the wildcard record, exactly as auth.<domain> does.
    className: traefik
    host: otel.ai.camer.digital
    clusterIssuer: cert-home-cert-http
    # Namespace Traefik runs in, for the CiliumNetworkPolicy ingress rule.
    # Wrong value here = every push silently dropped by Cilium while the
    # collector looks perfectly healthy.
    traefikNamespace: traefik
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Second public OTLP collector, for OpenCode laptops.
#
# ⚠️ WHY A SECOND ONE rather than another host on aiCliOtel: the collector's
# `oidcauthextension` accepts exactly ONE `audience` string per extension
# instance, and OpenCode presents a token with a different `aud` than the
# clients governance-auth configures. Probed live against production
# 2026-09-02:
#
#   POST https://otel.ai.camer.digital/v1/traces
#     no auth                 -> 401
#     Bearer <opencode token> -> 401 "failed to verify token: oidc: expected
#                                audience \"governance-auth-cli\" got
#                                [\"opencode-cli\"]"
#
# The issuer check PASSED there -- the extension validates issuer/signature
# before audience -- which is what proves the OpenCode token is minted by the
# same `https://auth.ai.camer.digital` (authz-idp) issuer, by its device-code
# grant, and that ONLY the audience differs. Per lightbridge-authz ADR-0011
# Decision 5 a minted token's `aud` is always exactly the requesting
# `client_id` and a client cannot ask for another, so this can never be fixed
# by making OpenCode request `governance-auth-cli`. One audience per
# extension, one extension per collector.
#
# Everything else is shared: same issuer, same Alloy exporter, same three
# pipelines, same rendered body (_helpers.tpl's `publicOtel*` defines).
opencodeOtel:
  # Off by default, exactly like aiCliOtel: this opens a PUBLIC endpoint, so
  # turning it on is an explicit act in the values repo, not something a chart
  # bump does.
  enabled: false
  replicas: 2
  # `-contrib`: `oidcauthextension` ships only there. Same image and pin as
  # aiCliOtel -- these two move together or the audience-vs-issuer behaviour
  # verified on one stops being evidence for the other.
  image: "otel/opentelemetry-collector-contrib:0.158.0"
  # See the `initContainers` block in _helpers.tpl for why this exists (a real
  # prod incident: 0/2 replicas, 100% CrashLoopBackOff, ai-helm-values#216).
  initContainerImage: "curlimages/curl:8.11.1"
  displayName: OpenCode
  # RFC-0003 §2's matrix row for this source is "OpenCode"; lowercased here to
  # match the existing `ai-cli`/`microsoft-foundry` convention. Not invented --
  # `opencode` is also the token this repo already uses for the client
  # everywhere else (`opencode-cli`, `opencode-oauth2`).
  sourceAttribute: opencode
  memoryLimiterMib: 400
  memorySpikeLimitMib: 100
  alloyEndpoint: "alloy.observability.svc.cluster.local:4317"
  oidc:
    # Same issuer as aiCliOtel -- authz-idp. Only the audience differs.
    issuerUrl: "https://auth.ai.camer.digital"
    # ⚠️ A CLIENT ID, not a service name -- same rule as aiCliOtel's audience,
    # and the same failure mode: this MUST equal the `client_id` OpenCode's
    # device-code flow registers as in authz's `oauth2.clients`, and changing
    # one without the other silently 401s every push. `opencode-cli` is the
    # value the live probe above observed in the rejected token's `aud`.
    audience: "opencode-cli"
  ingress:
    enabled: true
    # Traefik, not the Envoy core-gateway: otel-opencode.<domain> resolves via
    # the same wildcard *.ai.camer.digital record otel.<domain> and
    # auth.<domain> use, so this needs no DNS change.
    className: traefik
    host: otel-opencode.ai.camer.digital
    clusterIssuer: cert-home-cert-http
    # Namespace Traefik runs in, for the CiliumNetworkPolicy ingress rule.
    # Wrong value here = every push silently dropped by Cilium while the
    # collector looks perfectly healthy.
    traefikNamespace: traefik
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  otlpNamespace: observability

# ⚠️ Never `optional: true` on a secretKeyRef env: env vars bind once at pod start
# and never refresh, so an optional ref lets a pod that beats ESO capture an EMPTY
# credential and fail auth forever (the context7 MCP_TOKEN incident). Required
# means the pod waits in ContainerCreating until ESO has synced.
#
# app-template v4's own values.schema.json does not accept an `optional` key on
# secretKeyRef at all (verified: `helm template` rejects it with "Additional
# property optional is not allowed"), so the container env entries below in
# `app-template.controllers.*` cannot spell out `optional: false` explicitly.
# Every one of them omits the field instead, which is functionally identical --
# the Kubernetes API defaults `optional` to `false` (required) when it is
# absent -- but the "waits in ContainerCreating until ESO has synced" behaviour
# depends on that Kubernetes default rather than on an explicit chart setting.
#
# NOTE: `dbPasswordProperty`/`internalIngestTokenProperty` name properties
# inside `remoteKey` that this chart assumes but has not verified live against
# the actual secret store entry (unlike redact-gateway's `saltProperty`,
# which was) -- confirm they match before relying on this in a real
# environment. The resolve-token property (`governance_internal_resolve_token`)
# was removed in ADR-0017; TokenReview replaces the shared secret.
externalSecret:
  enabled: true
  storeRef: ssegning-aws
  remoteKey: ai/camer/digital/prod/env
  # The `governance` CNPG role's password (ai-helm's charts/lightbridge-db).
  # NOT a full connection string -- see the comment on .Values.databaseUrl
  # above for why that would be redundant.
  dbPasswordProperty: governance_db_password
  # Shared secret the OpenTelemetry Collector presents on `/internal/v1/ingest`
  # (#30, RFC-0002). Wired as an ExternalSecret `data` entry below and a
  # required (never-optional) secretKeyRef in the
  # `app-template.controllers.api` container env.
  # Required -- main.rs has no default, so a pod started without it never
  # comes up (clap errors "required argument missing").
  internalIngestTokenProperty: governance_internal_ingest_token
  # Copilot collector credentials. The GitHub App id + PEM live on `remoteKey`;
  # the S3 keys live on `s3RemoteKey` (the shared material the platform's S3
  # users all read). Property names must be created in the remote entries when
  # the production App is registered (values-repo-FIRST).
  #
  # `s3RemoteKey` must be set in the deployed values: it is left empty here so
  # a missed override fails the ExternalSecret sync loudly instead of silently
  # archiving the raw report against the wrong material (a placeholder
  # "prod/meta/test-app" was rejected in review for exactly that reason).
  githubAppIdProperty: governance_github_app_id
  githubAppPrivateKeyProperty: governance_github_app_private_key
  s3RemoteKey: ""
  s3AccessKeyProperty: s3_backup_cnpg_client_id
  s3SecretKeyProperty: s3_backup_cnpg_secret

# bjw-s/app-template v4 (ADR-independent chart migration) expresses the API
# Deployment, the copilot-sync CronJob, their containers/probes/security
# contexts and the Service. It does not cover ExternalSecret,
# CiliumNetworkPolicy or ServiceMonitor -- those stay as local templates
# (templates/externalsecret.yaml, templates/ciliumnetworkpolicy.yaml,
# templates/servicemonitor.yaml) and key off `.Values.name`/`.Values.copilot.*`/
# `.Values.externalSecret.*` above, exactly as before the migration.
#
# Helm values files are never templated (only templates/*.yaml are), so any
# value typed directly into this block is frozen at whatever literal was
# written here -- it cannot track a deployed override of the corresponding
# top-level key. Structural literals that are genuinely stable per
# deployment (the chart name, the ExternalSecret property names) are
# duplicated instead, and every duplication is commented at its use site.
# Values that DO vary per deployment (copilot.tenantId/org/s3.*) are instead
# routed through templates/configmap-copilot.yaml and consumed via envFrom,
# which is a real template and so can read them -- see that file's header
# comment for why.
app-template:
  global:
    # Pins every generated resource's fullname to `lightbridge-governance`
    # regardless of the Helm release name, matching what every resource in
    # this chart was named before the v4 migration (an unpinned name would
    # rename the Deployment/CronJob/Service on upgrade -- an orphan-old,
    # create-new instead of an in-place update).
    fullnameOverride: lightbridge-governance

  # Shared between both controllers below (identical before the migration).
  defaultPodOptions:
    # ADR-0017: the API pod needs its own ServiceAccount token to authenticate
    # to the kube-apiserver for TokenReview. `automountServiceAccountToken:
    # true` mounts the default SA token at the well-known path
    # `/var/run/secrets/kubernetes.io/serviceaccount/token` (plus `ca.crt`),
    # which the TokenReviewVerifier reads. copilot-sync/verify keep this off
    # via a per-controller override -- they do not call kube-apiserver.
    automountServiceAccountToken: true
    # Preserves the pre-migration behaviour: neither template set this before,
    # so Kubernetes' own default (true) applied. app-template defaults it to
    # false; set it back explicitly so nothing about the pod's environment
    # changes as a side effect of the chart migration.
    enableServiceLinks: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      seccompProfile: { type: RuntimeDefault }

  # ADR-0017: a dedicated ServiceAccount for the API pod, which the
  # TokenReview ClusterRoleBinding (templates/rbac.yaml) grants `create` on
  # `tokenreviews`. The API pod runs as this SA so it can authenticate to the
  # kube-apiserver for TokenReview. copilot-sync/verify stay on the `default`
  # SA (they never call kube-apiserver).
  serviceAccount:
    main:
      enabled: true
      forceRename: lightbridge-governance

  controllers:
    api:
      type: deployment
      # Without forceRename, having two enabled controllers makes app-template
      # suffix the identifier onto the fullname ("lightbridge-governance-api").
      forceRename: lightbridge-governance
      # ADR-0017: run as the dedicated SA so the TokenReview ClusterRoleBinding
      # (templates/rbac.yaml) applies. Without this the pod would run as
      # `default` and the TokenReview call would be denied by RBAC.
      serviceAccount:
        name: lightbridge-governance
      replicas: 1
      # Preserves the pre-migration default: Kubernetes' own Deployment
      # defaults (RollingUpdate, revisionHistoryLimit: 10) applied before,
      # since neither was set. app-template defaults to Recreate / 3.
      strategy: RollingUpdate
      revisionHistoryLimit: 10
      labels:
        app: lightbridge-governance
      pod:
        labels:
          app: lightbridge-governance
      containers:
        main:
          image:
            repository: ghcr.io/adorsys-gis/lightbridge-governance
            # Structural default only. Cannot fall back to `.Chart.AppVersion`
            # the way the pre-migration template did: values.yaml is never
            # templated, and `.Chart` inside a dependency's own templates
            # resolves to THAT chart's Chart.yaml (app-template's), not ours.
            # Keep this in sync with this chart's Chart.yaml `appVersion` --
            # deployed values (ai-helm-values) always override it regardless.
            tag: "0.1.0"
            pullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            LISTEN_ADDR: "0.0.0.0:8080"
            # Duplicated from externalSecret.dbPasswordProperty above (see the
            # app-template block's top comment for why). Must be defined
            # before DATABASE_URL in the rendered env list for its
            # `$(DB_PASSWORD)` reference to resolve -- `dependsOn` on
            # DATABASE_URL below is what guarantees that ordering, since this
            # env block is a YAML map and app-template does not otherwise
            # preserve key order (see `global.databaseUrl`'s comment in this
            # file for the full reasoning).
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_db_password
            DATABASE_URL:
              value: "{{ .Values.global.databaseUrl }}"
              dependsOn: DB_PASSWORD
            # ADR-0017: TokenReview-based caller authentication replaces the
            # shared X-Internal-Token. KUBE_APISERVER_URL is the in-cluster
            # API endpoint; TOKEN_REVIEW_AUDIENCE must match the projected
            # volume's serviceAccountToken audience; ALLOWED_SERVICE_ACCOUNTS
            # lists the ServiceAccounts permitted to call /internal/v1/resolve.
            KUBE_APISERVER_URL: "https://kubernetes.default.svc"
            TOKEN_REVIEW_AUDIENCE: "api"
            ALLOWED_SERVICE_ACCOUNTS: "{{ .Values.allowedServiceAccounts }}"
            INTERNAL_INGEST_TOKEN:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_internal_ingest_token
            # Both have safe defaults in the binary (60s / 10000 entries) --
            # exposed here as ordinary, always-optional values.
            RESOLVE_CACHE_TTL_SECS: "60"
            RESOLVE_CACHE_MAX_CAPACITY: "10000"
            # Bounds the /metrics freshness query, same reasoning as
            # RESOLVE_TIMEOUT_MS. Safe default in the binary (3000ms).
            CONNECTOR_METRICS_TIMEOUT_MS: "3000"
          # TENANT_ID arrives via ConfigMap, not as a literal above.
          #
          # ⚠️ It is REQUIRED by the binary -- `--tenant-id` carries no
          # default, because an empty tenant has no safe meaning in the WHERE
          # clause of the `ingest_manifests` freshness query /metrics derives
          # from (ADR-0007). Drop this envFrom and the pod CrashLoopBackOffs
          # on every start during clap parsing, which is exactly how
          # INTERNAL_INGEST_TOKEN was broken before it was wired.
          #
          # It cannot be a `{{ .Values.copilot.tenantId }}` literal in this
          # block: app-template does run `tpl` on env values, but in the
          # SUBCHART's context, where `.Values` is this `app-template:` key
          # and `.Values.copilot` does not exist (it fails with "nil pointer
          # evaluating interface {}.tenantId"). `global.databaseUrl` above
          # works only because Helm propagates `global` into subcharts. A
          # real template can read the parent's values, hence the ConfigMap
          # -- the same technique templates/configmap-copilot.yaml uses.
          #
          # Sourced from `copilot.tenantId` rather than a second top-level
          # key: the API and the copilot-sync CronJob are one single-tenant
          # deployment (ADR-0001), and two knobs for one tenant is a drift
          # bug waiting to happen -- set one, forget the other, and /metrics
          # reports on a tenant that has no rows.
          envFrom:
            - configMapRef:
                name: lightbridge-governance-api
          # `/livez` and `/readyz` are unauthenticated and check only that the
          # process is up -- they do not touch the database (ADR-0006's
          # resolve endpoint is the one place a DB check belongs, and even
          # there it fails closed rather than gating this probe).
          probes:
            liveness:
              enabled: true
              type: HTTP
              path: /livez
              spec:
                initialDelaySeconds: 5
                periodSeconds: 20
            readiness:
              enabled: true
              type: HTTP
              path: /readyz
              spec:
                initialDelaySeconds: 2
                periodSeconds: 10
            startup:
              enabled: false
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }

    copilot-sync:
      type: cronjob
      forceRename: copilot-sync
      # copilot-sync never calls kube-apiserver -- stay on the `default` SA
      # (ADR-0017), not the API pod's dedicated SA.
      serviceAccount:
        name: default
      labels:
        app: lightbridge-governance
      pod:
        # copilot-sync does not call kube-apiserver -- keep automount off
        # so the CronJob pods carry no SA token (ADR-0017).
        automountServiceAccountToken: false
        labels:
          app: lightbridge-governance
          # Distinct from the API Deployment so the egress CNP can select the
          # CronJob pods alone (they share the `app` label otherwise).
          app.kubernetes.io/component: copilot-sync
      cronjob:
        schedule: "0 */6 * * *"
        concurrencyPolicy: Forbid
        # Well under the 6-hour schedule interval: without this, a delayed
        # tick (a control-plane hiccup around the trigger time) is silently
        # skipped instead of started late.
        startingDeadlineSeconds: 900
        successfulJobsHistory: 3
        failedJobsHistory: 5
        backoffLimit: 4
        activeDeadlineSeconds: 1800
      containers:
        main:
          image:
            repository: ghcr.io/adorsys-gis/lightbridge-governance
            tag: "0.1.0"
            pullPolicy: IfNotPresent
          # Same image as the API Deployment -- both binaries are built into
          # it (.docker/Dockerfile). Override the image's own ENTRYPOINT
          # (lightbridge-governance) to run the collector CLI.
          command: ["/usr/local/bin/governance-ctl"]
          args: ["sync"]
          env:
            # See the api container's env above for why DB_PASSWORD must
            # come before DATABASE_URL (`dependsOn`) and why DATABASE_URL
            # reads `.Values.global.databaseUrl`, not a plain top-level key.
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_db_password
            DATABASE_URL:
              value: "{{ .Values.global.databaseUrl }}"
              dependsOn: DB_PASSWORD
            GH_APP_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_github_app_id
            # The PEM is mounted as a file (Config reads a path, never an env
            # value) via the `persistence.github-app-key` item below, and the
            # key is fetched by ExternalSecret.
            GH_APP_PRIVATE_KEY_FILE: /etc/lightbridge/github-app.pem
            AWS_ACCESS_KEY_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_client_id
            AWS_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_secret
          # TENANT_ID, GH_ORG and the AWS_ENDPOINT_URL/AWS_REGION/
          # AWS_FORCE_PATH_STYLE/S3_BUCKET quartet come from the local `copilot`
          # ConfigMap (templates/configmap-copilot.yaml), not a plain templated
          # env value here: this env map is never templated, so a value typed
          # in it can't track copilot.tenantId/org/s3.* overrides from the
          # deployed values -- see that ConfigMap's own header comment. Always
          # required (never optional): TENANT_ID has no safe default, and its
          # absence must surface as the collector's own required-arg failure,
          # not a silently-missing env var.
          #
          # OTEL_EXPORTER_OTLP_ENDPOINT comes from the separate, optional
          # `otlp` ConfigMap (templates/configmap-otlp.yaml), which only
          # renders when copilot.otlp.host is set -- see the comment on that
          # value above.
          envFrom:
            - configMapRef:
                name: lightbridge-governance-copilot
            - configMapRef:
                name: lightbridge-governance-otlp
                optional: true
          resources:
            # A batch job doing paginated GitHub/S3 I/O with up to a 28-day
            # backfill; a bit more headroom than the always-on API.
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }

    copilot-verify:
      type: cronjob
      forceRename: copilot-verify
      # copilot-verify never calls kube-apiserver -- stay on the `default` SA
      # (ADR-0017), not the API pod's dedicated SA.
      serviceAccount:
        name: default
      labels:
        app: lightbridge-governance
      pod:
        # copilot-verify does not call kube-apiserver (ADR-0017).
        automountServiceAccountToken: false
        labels:
          app: lightbridge-governance
          # Own component label so the egress CNP and the collector's
          # ingress CNP can select these pods alongside copilot-sync's --
          # verify/status push their gauges into the same collector.
          app.kubernetes.io/component: copilot-verify
      cronjob:
        # Daily, at 03:30 UTC -- offset from the 6h sync ticks (00/06/12/18)
        # so the two jobs' pushes don't bunch up on the collector bridge, and
        # well inside the collector's metricExpiration (30h, see copilotOtel
        # above) so the drift/unmapped gauges never expire between runs.
        schedule: "30 3 * * *"
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 900
        successfulJobsHistory: 3
        failedJobsHistory: 5
        backoffLimit: 2
        activeDeadlineSeconds: 600
      containers:
        # BOTH verbs in ONE pod -- the distroless runtime image has no shell
        # to chain commands with (see .docker/Dockerfile), and both are cheap
        # read-only reconciliation passes. `verify` reconciles stored row
        # counts against the manifests and pushes the manifest-drift gauge;
        # `status` reports last-success age and unmapped users and pushes
        # those gauges. Without this CronJob the dashboard's "Manifest drift
        # (verify)" and "Unmapped users" panels have no series at all -- the
        # chart only ever scheduled `sync`.
        verify:
          image:
            repository: ghcr.io/adorsys-gis/lightbridge-governance
            tag: "0.1.0"
            pullPolicy: IfNotPresent
          command: ["/usr/local/bin/governance-ctl"]
          args: ["verify"]
          env:
            # The SAME env set as copilot-sync, minus nothing: Config::from_env
            # eagerly builds the S3 archive sink and reads the GitHub App PEM
            # even for verbs that never call GitHub or S3
            # (app/governance-ctl/src/sync.rs::from_env).
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_db_password
            DATABASE_URL:
              value: "{{ .Values.global.databaseUrl }}"
              dependsOn: DB_PASSWORD
            GH_APP_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_github_app_id
            GH_APP_PRIVATE_KEY_FILE: /etc/lightbridge/github-app.pem
            AWS_ACCESS_KEY_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_client_id
            AWS_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_secret
          envFrom:
            - configMapRef:
                name: lightbridge-governance-copilot
            - configMapRef:
                name: lightbridge-governance-otlp
                optional: true
          resources:
            # Read-only reconciliation + one small OTLP push; lighter than the
            # sync job's paginated GitHub/S3 I/O.
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        status:
          image:
            repository: ghcr.io/adorsys-gis/lightbridge-governance
            tag: "0.1.0"
            pullPolicy: IfNotPresent
          command: ["/usr/local/bin/governance-ctl"]
          args: ["status"]
          # Identical env/envFrom to the `verify` container above -- see its
          # comment for why the full set is required.
          env:
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_db_password
            DATABASE_URL:
              value: "{{ .Values.global.databaseUrl }}"
              dependsOn: DB_PASSWORD
            GH_APP_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: governance_github_app_id
            GH_APP_PRIVATE_KEY_FILE: /etc/lightbridge/github-app.pem
            AWS_ACCESS_KEY_ID:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_client_id
            AWS_SECRET_ACCESS_KEY:
              valueFrom:
                secretKeyRef:
                  name: lightbridge-governance-env
                  key: s3_backup_cnpg_secret
          envFrom:
            - configMapRef:
                name: lightbridge-governance-copilot
            - configMapRef:
                name: lightbridge-governance-otlp
                optional: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }

  persistence:
    # Duplicated from externalSecret.githubAppPrivateKeyProperty above.
    github-app-key:
      type: secret
      name: lightbridge-governance-env
      items:
        - key: governance_github_app_private_key
          path: github-app.pem
      advancedMounts:
        copilot-sync:
          main:
            - path: /etc/lightbridge
              readOnly: true
        copilot-verify:
          verify:
            - path: /etc/lightbridge
              readOnly: true
          status:
            - path: /etc/lightbridge
              readOnly: true

  service:
    main:
      controller: api
      primary: true
      labels:
        app: lightbridge-governance
      ports:
        http:
          port: 8080
          protocol: HTTP
          primary: true
