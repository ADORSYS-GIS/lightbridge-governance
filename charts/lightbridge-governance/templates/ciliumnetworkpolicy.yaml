{{- if .Values.networkPolicy.enabled }}
{{- /*
Egress for the two collector CronJobs (RFC-0001, #12 AC: "Egress to GitHub
AND to the signed-download host is allowed explicitly").

Why this shape:
- The cluster runs Cilium default-deny-egress; a plain NetworkPolicy ipBlock
  does NOT match on Cilium -- only a CiliumNetworkPolicy toFQDNs does.
- The signed-download host is PINNED from spike-0007's live run, not guessed:
  the report envelope's `url` host was `copilot-reports.github.com`, verbatim.
  GitHub's blob storage backs it, so `*.blob.core.windows.net` is included as
  the redirect target the pinned host may resolve to.
- Scoped to `app.kubernetes.io/component` in copilot-sync and copilot-verify
  because the API Deployment shares the `app` label -- selecting `app` would
  also cut the API's Postgres egress. copilot-verify shares this policy
  rather than getting a second near-duplicate: its verify/status verbs never
  call GitHub or S3, so the extra FQDNs are permission, not use. (It also
  needs DNS + the OTLP egress below, which is why it can't be policy-less.)
- DNS egress is required for toFQDNs to resolve (Cilium resolves FQDNs via
  cluster DNS, then caches by TTL).
- The OTLP egress rule below is toEndpoints (in-cluster collector, the
  default) XOR toFQDNs (manual external override), never both -- see
  templates/otelcollector.yaml and copilotOtel/copilot.otlp.host's comments
  in values.yaml. The collector's own ingress side (accepting this push,
  plus Alloy's scrape) lives in the separate
  templates/ciliumnetworkpolicy-copilot-otel.yaml, gated on the same
  copilotOtel.enabled toggle.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ .Values.name }}-copilot-sync-egress
  labels:
    app: {{ .Values.name }}
spec:
  description: >-
    copilot-sync may resolve DNS and reach GitHub's API, the pinned
    copilot-reports.github.com signed-download host (spike-0007) and the S3
    raw archive. copilot-verify shares the policy for its DNS + OTLP needs.
    Nothing else.
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [copilot-sync, copilot-verify]
  egress:
    # DNS, with L7 visibility (required for toFQDNs resolution).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # GitHub API (installation tokens + report envelopes) and the S3 archive.
    - toFQDNs:
        - matchName: api.github.com
        - matchName: copilot-reports.github.com
        - matchPattern: "*.blob.core.windows.net"
        - matchName: nbg1.your-objectstorage.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    {{- if .Values.copilotOtel.enabled }}
    # OTLP metrics push to the dedicated in-cluster collector (push, not
    # scrape: CronJob pods die after each run -- see
    # templates/otelcollector.yaml). Same namespace as this CronJob, so
    # toEndpoints + a plain (unprefixed) label match, not toFQDNs -- an
    # in-cluster Service has no DNS name worth pinning by FQDN the way the
    # external GitHub/S3 hosts above do, and toEndpoints is enforced by
    # identity rather than by a resolved-and-cached DNS answer.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/managed-by: opentelemetry-operator
            app.kubernetes.io/component: opentelemetry-collector
            app.kubernetes.io/instance: {{ printf "%s.%s" .Release.Namespace (include "lightbridge-governance.otelCollectorName" .) }}
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    {{- else if .Values.copilot.otlp.host }}
    # Manual/external override path only (copilotOtel.enabled: false) -- see
    # copilot.otlp.host's comment in values.yaml. Only emitted when a host
    # is actually set; toFQDNs is correct here because this target is
    # outside the cluster.
    - toFQDNs:
        - matchName: {{ .Values.copilot.otlp.host | quote }}
      toPorts:
        - ports:
            - port: {{ .Values.copilot.otlp.port | quote }}
              protocol: TCP
    {{- end }}
{{- end }}
