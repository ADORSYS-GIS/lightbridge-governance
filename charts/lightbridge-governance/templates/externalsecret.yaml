{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}-env
  labels:
    app: {{ .Values.name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.storeRef }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.name }}-env
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecret.databaseUrlProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.databaseUrlProperty }}
    - secretKey: {{ .Values.externalSecret.internalResolveTokenProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.internalResolveTokenProperty }}
    - secretKey: {{ .Values.externalSecret.internalIngestTokenProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.internalIngestTokenProperty }}
    # Copilot collector (copilot-sync CronJob). The GitHub App's credentials --
    # id + PEM -- and the S3 raw-archive keys, from the same ssegning-aws
    # material LibreChat and the CNPG backups use (see copilot.s3 in values).
    # Property names must exist in the remote keys; set them in the deployed
    # values (ai-helm-values) once the production App is registered.
    - secretKey: {{ .Values.externalSecret.githubAppIdProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.githubAppIdProperty }}
    - secretKey: {{ .Values.externalSecret.githubAppPrivateKeyProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteKey }}
        property: {{ .Values.externalSecret.githubAppPrivateKeyProperty }}
    - secretKey: {{ .Values.externalSecret.s3AccessKeyProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.s3RemoteKey }}
        property: {{ .Values.externalSecret.s3AccessKeyProperty }}
    - secretKey: {{ .Values.externalSecret.s3SecretKeyProperty }}
      remoteRef:
        key: {{ .Values.externalSecret.s3RemoteKey }}
        property: {{ .Values.externalSecret.s3SecretKeyProperty }}
{{- end }}
