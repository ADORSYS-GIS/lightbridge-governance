apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # No Kubernetes API access needed.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            # DB_PASSWORD must come BEFORE DATABASE_URL in this list -- Kubernetes'
            # $(VAR_NAME) substitution only resolves references to env vars already
            # defined earlier in the same container. The password is the only secret
            # part of the connection string; everything else is .Values.databaseUrl,
            # a plain (non-secret) value set per-environment.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.dbPasswordProperty }}
                  # ⚠️ NEVER optional. See values.yaml's comment above
                  # `externalSecret` -- an optional ref lets a pod that beats
                  # ESO capture an empty password and never recover.
                  optional: false
            - name: DATABASE_URL
              value: {{ .Values.databaseUrl | quote }}
            - name: INTERNAL_RESOLVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.internalResolveTokenProperty }}
                  optional: false
            - name: INTERNAL_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.internalIngestTokenProperty }}
                  optional: false
          # `/livez` and `/readyz` are unauthenticated and check only that the
          # process is up -- they do not touch the database (ADR-0006's
          # resolve endpoint is the one place a DB check belongs, and even
          # there it fails closed rather than gating this probe).
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
            periodSeconds: 20
