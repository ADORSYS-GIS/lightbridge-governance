apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # No Kubernetes API access needed.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.api.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.databaseUrlProperty }}
                  # ⚠️ NEVER optional. See values.yaml's comment above
                  # `externalSecret` -- an optional ref lets a pod that beats
                  # ESO capture an empty connection string and never recover.
                  optional: false
            - name: INTERNAL_RESOLVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.internalResolveTokenProperty }}
                  optional: false
          # `/livez` and `/readyz` are unauthenticated and check only that the
          # process is up -- they do not touch the database (ADR-0006's
          # resolve endpoint is the one place a DB check belongs, and even
          # there it fails closed rather than gating this probe).
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.api.port }} }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: {{ .Values.api.port }} }
            initialDelaySeconds: 5
            periodSeconds: 20
