# No separate one-shot backfill Job (deliberately -- see governance-ctl's own
# module doc): `sync` reads the database high-water mark and backfills up to
# 28 days on its own whenever it is behind, which covers bootstrap, outage
# recovery, and a late-published report with one mechanism.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copilot-sync
  labels:
    app: {{ .Values.name }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: {{ .Values.sync.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.sync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.sync.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.sync.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: {{ .Values.name }}
            # Distinct from the API Deployment so the egress CNP can select the
            # CronJob pods alone (they share the `app` label otherwise).
            app.kubernetes.io/component: copilot-sync
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: copilot-sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Same image as the API Deployment -- both binaries are built
              # into it (.docker/Dockerfile). Override the image's own
              # ENTRYPOINT (lightbridge-governance) to run the collector CLI.
              command: ["/usr/local/bin/governance-ctl"]
              args: ["sync"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                # DB_PASSWORD must come BEFORE DATABASE_URL -- see deployment.yaml's
                # comment on Kubernetes' $(VAR_NAME) substitution ordering.
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.name }}-env
                      key: {{ .Values.externalSecret.dbPasswordProperty }}
                      optional: false
                - name: DATABASE_URL
                  value: {{ .Values.databaseUrl | quote }}
                - name: TENANT_ID
                  value: {{ .Values.copilot.tenantId | quote }}
                - name: GH_ORG
                  value: {{ .Values.copilot.org | quote }}
                - name: GH_APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.name }}-env
                      key: {{ .Values.externalSecret.githubAppIdProperty }}
                      optional: false
                - name: GH_APP_PRIVATE_KEY_FILE
                  value: /etc/lightbridge/github-app.pem
                # The PEM is mounted as a file (Config reads a path, never an
                # env value), and the key is fetched by ExternalSecret.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.name }}-env
                      key: {{ .Values.externalSecret.s3AccessKeyProperty }}
                      optional: false
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.name }}-env
                      key: {{ .Values.externalSecret.s3SecretKeyProperty }}
                      optional: false
                - name: AWS_ENDPOINT_URL
                  value: {{ .Values.copilot.s3.endpoint | quote }}
                - name: AWS_REGION
                  value: {{ .Values.copilot.s3.region | quote }}
                - name: AWS_FORCE_PATH_STYLE
                  value: {{ .Values.copilot.s3.forcePathStyle | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.copilot.s3.bucket | quote }}
                {{- if .Values.copilot.otlp.host }}
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: {{ printf "http://%s:%s" .Values.copilot.otlp.host .Values.copilot.otlp.port | quote }}
                {{- end }}
              volumeMounts:
                - name: github-app-key
                  mountPath: /etc/lightbridge
                  readOnly: true
          volumes:
            - name: github-app-key
              secret:
                secretName: {{ .Values.name }}-env
                items:
                  - key: {{ .Values.externalSecret.githubAppPrivateKeyProperty }}
                    path: github-app.pem
