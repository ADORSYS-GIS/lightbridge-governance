# No separate one-shot backfill Job (deliberately -- see governance-ctl's own
# module doc): `sync` reads the database high-water mark and backfills up to
# 28 days on its own whenever it is behind, which covers bootstrap, outage
# recovery, and a late-published report with one mechanism.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: copilot-sync
  labels:
    app: {{ .Values.name }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: {{ .Values.sync.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.sync.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.sync.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.sync.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.sync.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app: {{ .Values.name }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: copilot-sync
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # Same image as the API Deployment -- both binaries are built
              # into it (.docker/Dockerfile). Override the image's own
              # ENTRYPOINT (lightbridge-governance) to run the collector CLI.
              command: ["/usr/local/bin/governance-ctl"]
              args: ["sync"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.name }}-env
                      key: {{ .Values.externalSecret.databaseUrlProperty }}
                      optional: false
