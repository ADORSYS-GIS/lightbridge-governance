{{- /*
The AI-CLI collector's body lives in `lightbridge-governance.publicOtelCollector`
(_helpers.tpl), shared with the OpenCode collector in
otelcollector-opencode.yaml. Every ⚠️ comment in it records a production
incident, so it is instantiated twice rather than copy-pasted -- a copy is a
copy that silently stops being updated.

The `aiCliOtel` values key is deliberately NOT renamed: ai-helm-values sets it
by name (environments/prod/values/lightbridge-governance.yaml) and that repo
lands before this chart.
*/}}
{{- if .Values.aiCliOtel.enabled }}
{{- include "lightbridge-governance.publicOtelCollector" (dict "root" . "otel" .Values.aiCliOtel "name" (include "lightbridge-governance.aiCliOtelName" .)) }}
{{- end }}
