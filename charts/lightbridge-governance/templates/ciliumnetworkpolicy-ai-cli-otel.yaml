{{- if and .Values.aiCliOtel.enabled .Values.networkPolicy.enabled }}
{{- /*
Ingress/egress for the public AI-CLI OTLP collector in
templates/otelcollector-ai-cli.yaml.

Exactly one ingress caller: Traefik, which terminates TLS for
otel.<domain> and proxies to this collector's :4318. Unlike the copilot
collector, this one has a real egress need -- it forwards all three signals
to Alloy -- so egress is DNS *plus* Alloy, not DNS alone.

⚠️ Any CiliumNetworkPolicy with an `ingress:` block makes the selected pods
deny-by-default for ingress, INCLUDING kubelet's liveness/readiness probes,
which arrive with host/remote-node identity rather than a pod identity.
Without `fromEntities: [host, remote-node, health]` this collector never goes
Ready and reads exactly like a crash loop rather than a network policy
problem -- the trap charts/redact-gateway's CNP documents and that was
verified live there.

The endpointSelector pins `app.kubernetes.io/instance` to THIS collector.
The copilot collector's policy does the same for its own, so the two never
overlap despite sharing the operator's managed-by/component labels -- if that
instance key were dropped, each policy would apply to both collectors and
Traefik's traffic would be denied by the copilot policy.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "lightbridge-governance.aiCliOtelName" . }}
  labels:
    app: {{ .Values.name }}
spec:
  description: >-
    The AI-CLI OTLP collector accepts OTLP/HTTP from Traefik on 4318 and
    forwards traces, metrics and logs to Alloy. Nothing else reaches it.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: {{ printf "%s.%s" .Release.Namespace (include "lightbridge-governance.aiCliOtelName" .) }}
  ingress:
    # Traefik's proxied OTLP/HTTP. Cross-namespace, so every key is
    # `k8s:`-prefixed, matching this chart's existing Alloy rules.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.aiCliOtel.ingress.traefikNamespace }}
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # Kubelet probes -- see the trap called out above this policy.
    - fromEntities: [host, remote-node, health]
  egress:
    # Alloy, the fan-out point for all three signals. The copilot collector
    # needs no equivalent rule because its prometheus exporter is pull-only;
    # this one genuinely pushes, so without this every export is dropped and
    # the collector looks healthy while delivering nothing.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.otlpNamespace }}
            k8s:app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # DNS, needed to resolve both Alloy and the OIDC issuer.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # ⚠️ The oidc extension fetches OIDC discovery + JWKS from the PUBLIC
    # issuer URL at startup and refreshes keys thereafter. Without egress to
    # it the extension fails to start and the collector never becomes Ready
    # -- which presents as a broken collector, not as a network policy
    # problem.
    #
    # ⚠️ THIS IS NOT EGRESS TO THE EXTERNAL ISSUER IP, on purpose. Two
    # earlier attempts here were both wrong, in the same specific way
    # (lightbridge-governance#85/#87/#88 incident, 2026-08-10):
    #
    #   1. `toFQDNs: matchName: auth.ai.camer.digital` -- looked correctly
    #      compiled (`cilium bpf policy get` showed the right rule, right
    #      identity, DNS resolving fine through the proxy) and still 100%
    #      timed out, on two different nodes, with zero drop verdicts ever
    #      logged.
    #   2. `toCIDR: 46.225.40.134/32` (the LB's own IP) -- same result.
    #      Also 100% timeout, also zero bytes/packets ever recorded against
    #      a rule Cilium's own tooling reported as freshly compiled and
    #      correctly enforced.
    #
    # The common factor across both failures: BOTH were egress to an
    # EXTERNAL (non-cluster-CIDR) destination. A `toEndpoints` rule to
    # Alloy -- also on this policy, in-cluster -- worked instantly for the
    # exact same CNP-restricted endpoint, on the exact same node, at the
    # exact same time the external rule was failing. That isolates the
    # actual problem to external egress specifically from a policy-enabled
    # endpoint on this cluster (masquerade/SNAT not applying correctly is
    # the leading theory, but that's a Cilium/node-level question, not
    # something this chart's own resources can fix or fully diagnose).
    #
    # So instead of external egress at all: this rule reaches Traefik's own
    # pods IN-CLUSTER -- the same `toEndpoints` mechanism already proven to
    # work above -- and `otelcollector-ai-cli.yaml` adds a `hostAliases`
    # entry so the issuer hostname resolves to Traefik's ClusterIP instead
    # of its external LoadBalancer IP. Traefik terminates TLS identically
    # either way (same pods, same cert, same SNI routing -- confirmed live:
    # a request with `Host: auth.ai.camer.digital` sent straight to
    # Traefik's ClusterIP returns the same 200 as going in through the
    # public LB), so this changes the path, not the destination identity or
    # certificate trust.
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: traefik
            k8s:io.kubernetes.pod.namespace: {{ .Values.aiCliOtel.ingress.traefikNamespace }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
