{{- if and .Values.aiCliOtel.enabled .Values.networkPolicy.enabled }}
{{- /*
Ingress/egress for the public AI-CLI OTLP collector in
templates/otelcollector-ai-cli.yaml.

Exactly one ingress caller: Traefik, which terminates TLS for
otel.<domain> and proxies to this collector's :4318. Unlike the copilot
collector, this one has a real egress need -- it forwards all three signals
to Alloy -- so egress is DNS *plus* Alloy, not DNS alone.

⚠️ Any CiliumNetworkPolicy with an `ingress:` block makes the selected pods
deny-by-default for ingress, INCLUDING kubelet's liveness/readiness probes,
which arrive with host/remote-node identity rather than a pod identity.
Without `fromEntities: [host, remote-node, health]` this collector never goes
Ready and reads exactly like a crash loop rather than a network policy
problem -- the trap charts/redact-gateway's CNP documents and that was
verified live there.

The endpointSelector pins `app.kubernetes.io/instance` to THIS collector.
The copilot collector's policy does the same for its own, so the two never
overlap despite sharing the operator's managed-by/component labels -- if that
instance key were dropped, each policy would apply to both collectors and
Traefik's traffic would be denied by the copilot policy.
*/}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "lightbridge-governance.aiCliOtelName" . }}
  labels:
    app: {{ .Values.name }}
spec:
  description: >-
    The AI-CLI OTLP collector accepts OTLP/HTTP from Traefik on 4318 and
    forwards traces, metrics and logs to Alloy. Nothing else reaches it.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: opentelemetry-operator
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: {{ printf "%s.%s" .Release.Namespace (include "lightbridge-governance.aiCliOtelName" .) }}
  ingress:
    # Traefik's proxied OTLP/HTTP. Cross-namespace, so every key is
    # `k8s:`-prefixed, matching this chart's existing Alloy rules.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.aiCliOtel.ingress.traefikNamespace }}
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
    # Kubelet probes -- see the trap called out above this policy.
    - fromEntities: [host, remote-node, health]
  egress:
    # Alloy, the fan-out point for all three signals. The copilot collector
    # needs no equivalent rule because its prometheus exporter is pull-only;
    # this one genuinely pushes, so without this every export is dropped and
    # the collector looks healthy while delivering nothing.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.networkPolicy.otlpNamespace }}
            k8s:app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # DNS, needed to resolve both Alloy and the OIDC issuer.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
          rules:
            dns:
              - matchPattern: "*"
    # ⚠️ The oidc extension fetches OIDC discovery + JWKS from the PUBLIC
    # issuer URL at startup and refreshes keys thereafter. Without egress to
    # it on 443 the extension fails to start and the collector never becomes
    # Ready -- which presents as a broken collector, not as a network policy
    # problem.
    #
    # ⚠️ NOT `toFQDNs`. That was the original shape here and it is EMPIRICALLY
    # BROKEN in this cluster (lightbridge-governance#85/#87/#88 incident,
    # 2026-08-10) -- root-caused live, not assumed: `cilium bpf policy get`
    # showed the rule correctly compiled against the right per-node identity,
    # `cilium fqdn cache list` showed DNS resolving correctly through the
    # proxy, the DNS egress rule above (the same toEndpoints mechanism)
    # demonstrably works, and every single connection attempt still timed
    # out with ZERO bytes/packets ever recorded against that rule --
    # reproduced on two different nodes, dozens of attempts, no drop verdict
    # ever logged by `cilium monitor`. Whatever the underlying mechanism,
    # `toFQDNs` enforcement does not work for this destination on this
    # cluster's Cilium version/config today. Don't convert this back to
    # `toFQDNs` without re-testing that root cause first -- it will silently
    # reintroduce a 100%-reproducible outage, not a flaky one.
    #
    # `toCIDR` is a different, simpler Cilium primitive: a static CIDR-to-
    # identity mapping compiled once, not the DNS-proxy-interception +
    # per-response dynamic-identity machinery `toFQDNs` depends on -- and it
    # works.
    #
    # Deliberately a plain static value, NOT a Helm `lookup` against
    # Traefik's LoadBalancer Service for the "current" IP -- that was tried
    # and reverted. `lookup` returns nil under a plain `helm template`
    # even with a fully live, valid kubeconfig (verified directly against
    # this cluster while writing this), and ArgoCD's Helm rendering has the
    # same well-documented limitation, for the same reason ArgoCD needs a
    # reproducible render: a chart that queries live cluster state at
    # render time can't be diffed or cached deterministically. A `lookup`
    # here would silently never fire and always fall through to whatever
    # static default backed it -- strictly worse than just being honest
    # that this is static, since it would look self-updating while never
    # actually being self-updating.
    #
    # So: if `auth.ai.camer.digital` / `otel.ai.camer.digital`'s LoadBalancer
    # IP ever changes (confirmed live 2026-08-10 via
    # `kubectl get svc -n {{ .Values.aiCliOtel.ingress.traefikNamespace }} traefik`
    # -- both hostnames resolve to the same Traefik LB), this value has to
    # be updated by hand, in the same change that would already be touching
    # DNS/ingress config for that IP move.
    - toCIDR:
        - {{ .Values.aiCliOtel.oidc.issuerCIDR | quote }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
