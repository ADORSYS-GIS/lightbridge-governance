{{- if and .Values.grafanaDashboard.enabled .Values.grafanaDashboard.folder.enabled }}
# A dedicated Grafana folder for the Copilot dashboards.
#
# Mirrors the per-domain folders already on the cluster (ai-gateway,
# applications, collectors, lightbridge, model-serving, my-usage, platform) --
# all of them in `observability`, all reconciling. See
# values.yaml's grafanaDashboard.namespace for the evidence that Grafana lives
# there, and why these CRs are created there rather than in the release
# namespace.
#
# Field notes, read from the operator's v1beta1 API docs rather than recalled:
#   - `spec.instanceSelector` is REQUIRED on GrafanaFolder, with the same
#     same-namespace-only semantics GrafanaDashboard has.
#   - `spec.title` is the display name; when omitted it falls back to
#     `metadata.name`, which would put a hyphenated k8s slug in Grafana's
#     folder list.
#   - Only one of `spec.parentFolderRef` / `spec.parentFolderUID` may be set.
#     Neither is used here -- this is a top-level folder. To nest it under the
#     existing `lightbridge` folder instead, set `parentFolderRef: lightbridge`
#     (that folder is in the same namespace, so a ref works).
#
# ⚠️ `spec.instanceSelector` is IMMUTABLE. Correcting a wrong selector means
# DELETING and recreating this CR, not patching it -- `kubectl apply` of a
# changed selector is rejected. Same for `spec.uid` (not set here) and for
# disabling `allowCrossNamespaceImport`.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ .Values.name }}-{{ .Values.grafanaDashboard.folder.nameSuffix }}
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  title: {{ .Values.grafanaDashboard.folder.title | quote }}
  instanceSelector:
{{ toYaml .Values.grafanaDashboard.instanceSelector | indent 4 }}
  {{- if .Values.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
{{- end }}
