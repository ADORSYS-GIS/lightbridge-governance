{{- if .Values.grafanaDashboard.enabled }}
{{/* VS Code Copilot editor telemetry, separate from GitHub reports and seats. */}}
{{- $dashboardPath := "dashboards/vscode-copilot.json" }}
{{- $rawJson := .Files.Get $dashboardPath }}
{{- if not $rawJson }}
{{- fail (printf "grafanaDashboard.enabled is true but %s is missing or empty -- nothing to embed. See charts/lightbridge-governance/dashboards/vscode-copilot.json (scripts/generate_vscode_copilot_dashboard.py generates it)." $dashboardPath) }}
{{- end }}
{{- $dashboardJson := $rawJson | replace "__DS_LOKI__" .Values.grafanaDashboard.datasources.lokiUid | replace "__DS_PROMETHEUS__" .Values.grafanaDashboard.datasources.prometheusUid }}
{{- if or (contains "__DS_LOKI__" $dashboardJson) (contains "__DS_PROMETHEUS__" $dashboardJson) }}
{{- fail (printf "%s still contains an unsubstituted __DS_LOKI__/__DS_PROMETHEUS__ token after replace -- the dashboard JSON's placeholder token spelling has drifted from that contract this template substitutes. An unsubstituted token ships as a literal (invalid) datasource UID: Grafana renders the dashboard but every affected panel silently shows 'Datasource not found' or stays empty, with no error surfaced anywhere -- failing here at render time instead." $dashboardPath) }}
{{- end }}
{{- /*
Same broader, pattern-based guard as templates/grafanadashboard.yaml's --
see that file's own comment for why this catches a renamed token
(e.g. `__DS_LOKI__` -> some other spelling) that the exact-string checks
above cannot.
*/}}
{{- if regexMatch "__DS_[A-Z0-9_]+__" $dashboardJson }}
{{- fail (printf "%s still contains an unrecognized __DS_..._..__-shaped placeholder token after substitution -- this doesn't match either contracted token (__DS_LOKI__/__DS_PROMETHEUS__) by name, but its shape strongly suggests it's an unreplaced datasource placeholder from a token spelling this template doesn't know about. Fix the token spelling in the dashboard JSON (or this template's replace calls) to match the __DS_LOKI__/__DS_PROMETHEUS__ contract -- do not ship an unsubstituted placeholder, it becomes a literal invalid datasource UID with no error anywhere in Grafana." $dashboardPath) }}
{{- end }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ .Values.name }}-vscode-copilot
  # Created alongside Grafana, not in the release namespace -- see
  # values.yaml's grafanaDashboard.namespace.
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  # ⚠️ IMMUTABLE -- see values.yaml's grafanaDashboard.instanceSelector for
  # the full caveat and the deployed-cluster evidence for its current value.
  instanceSelector:
{{ toYaml .Values.grafanaDashboard.instanceSelector | indent 4 }}
  {{- if .Values.grafanaDashboard.vscodeCopilotFolder.enabled }}
  # `folderRef` references the GrafanaFolder CR in
  # templates/grafanafolder-vscode-copilot.yaml BY NAME, requiring it in the SAME
  # namespace as this dashboard -- both are created in
  # grafanaDashboard.namespace, so that holds.
  folderRef: {{ .Values.name }}-{{ .Values.grafanaDashboard.vscodeCopilotFolder.nameSuffix }}
  {{- end }}
  # ⚠️ Load-bearing whenever Grafana runs in a different namespace than this
  # chart -- see templates/grafanadashboard.yaml's own comment for the exact
  # failure mode (`status.NoMatchingInstances`) this guards against.
  allowCrossNamespaceImport: {{ .Values.grafanaDashboard.allowCrossNamespaceImport }}
  # A literal block scalar, not a quoted string -- see
  # templates/grafanadashboard.yaml's comment for why (`spec.json` is a
  # plain string field on this CRD, and a block scalar avoids re-escaping
  # every `"`/`\` a JSON blob is full of).
  json: |
{{ $dashboardJson | indent 4 }}
{{- end }}
