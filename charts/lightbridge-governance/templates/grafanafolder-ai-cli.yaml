{{- if and .Values.grafanaDashboard.enabled .Values.grafanaDashboard.aiCliFolder.enabled }}
# A sibling of templates/grafanafolder.yaml's Copilot folder, both nested
# under the same `Governance` parent -- see values.yaml's
# grafanaDashboard.aiCliFolder for why this is its own folder rather than
# reusing Copilot's, and for the `folder.enabled` coupling this depends on.
#
# This template ONLY creates the child folder; the `Governance` parent is
# templates/grafanafolder.yaml's responsibility (`folder.parent.create`),
# not duplicated here -- two templates both creating a GrafanaFolder named
# `governance` in this namespace would be a straightforward conflict, not a
# multi-release one, since both come from this same chart.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ .Values.name }}-{{ .Values.grafanaDashboard.aiCliFolder.nameSuffix }}
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  title: {{ .Values.grafanaDashboard.aiCliFolder.title | quote }}
  parentFolderRef: {{ .Values.grafanaDashboard.folder.parent.name }}
  instanceSelector:
{{ toYaml .Values.grafanaDashboard.instanceSelector | indent 4 }}
  {{- if .Values.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
{{- end }}
