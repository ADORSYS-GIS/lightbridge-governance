{{- if and .Values.grafanaDashboard.enabled .Values.grafanaDashboard.claudeCodeFolder.enabled }}
# A sibling of templates/grafanafolder-opencode.yaml's, templates/
# grafanafolder-ai-cli.yaml's and templates/grafanafolder.yaml's (Copilot's)
# folders, all nested under the same `Governance` parent -- see values.yaml's
# grafanaDashboard.claudeCodeFolder for why this is its own folder, and for
# the `folder.enabled` coupling this depends on.
#
# This template ONLY creates the child folder; the `Governance` parent is
# templates/grafanafolder.yaml's responsibility (`folder.parent.create`), not
# duplicated here.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaFolder
metadata:
  name: {{ .Values.name }}-{{ .Values.grafanaDashboard.claudeCodeFolder.nameSuffix }}
  namespace: {{ .Values.grafanaDashboard.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  title: {{ .Values.grafanaDashboard.claudeCodeFolder.title | quote }}
  parentFolderRef: {{ .Values.grafanaDashboard.folder.parent.name }}
  instanceSelector:
{{ toYaml .Values.grafanaDashboard.instanceSelector | indent 4 }}
  {{- if .Values.grafanaDashboard.allowCrossNamespaceImport }}
  allowCrossNamespaceImport: true
  {{- end }}
{{- end }}
