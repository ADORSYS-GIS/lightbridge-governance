apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      # No Kubernetes API access needed.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redact-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.port }}"
            - name: PROVIDER_BASE_URL
              value: {{ .Values.provider.baseUrl | quote }}
            - name: PROVIDER_TIMEOUT_SECS
              value: {{ .Values.provider.timeoutSecs | quote }}
            - name: REDACT_PROFILE
              value: {{ .Values.profile | quote }}
            # ⚠️ `int64` is load-bearing, not decoration. Helm parses a large
            # integer from values.yaml as a float, so a bare `| quote` renders
            # 33554432 as "3.3554432e+07" -- which clap rejects at startup with
            # `invalid digit found in string`, crash-looping the pod. It does
            # NOT reproduce via `--set` (that parses as int64), so a values-file
            # default is the only place it bites. Same family as the ai-helm
            # ADR-0109 `"n": 1` YAML-boolean trap.
            - name: MAX_BODY_BYTES
              value: {{ .Values.maxBodyBytes | int64 | quote }}
            {{- if .Values.internalCaTrust.enabled }}
            - name: PROVIDER_CA_FILE
              value: "{{ .Values.internalCaTrust.mountPath }}/ca.crt"
            {{- end }}
            - name: REDACT_HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-env
                  key: {{ .Values.externalSecret.saltProperty }}
                  # ⚠️ NEVER optional. An optional ref lets a pod that beats ESO
                  # capture an EMPTY salt and hash with it forever.
                  optional: false
          {{- if .Values.internalCaTrust.enabled }}
          volumeMounts:
            - name: internal-ca
              mountPath: {{ .Values.internalCaTrust.mountPath }}
              readOnly: true
          {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.port }} }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: {{ .Values.port }} }
            initialDelaySeconds: 5
            periodSeconds: 20
      {{- if .Values.internalCaTrust.enabled }}
      volumes:
        - name: internal-ca
          secret:
            secretName: {{ .Values.internalCaTrust.secretName }}
      {{- end }}
