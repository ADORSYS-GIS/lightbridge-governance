[package]
name = "redact-extproc"
description = "Envoy ext_proc server applying governance-redact to gateway traffic (ADR-0116)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "redact-extproc"
path = "src/main.rs"

[dependencies]
governance-redact.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
dotenvy.workspace = true
mimalloc.workspace = true
prometheus.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

envoy-types = "0.7"
tonic = { version = "0.14", default-features = false, features = ["codegen", "transport", "router"] }
prost = { version = "0.14", default-features = false, features = ["derive"] }
tokio-stream = { version = "0.1", features = ["sync"] }
flate2 = { version = "1.1.9", features = ["rust_backend"] }

[dev-dependencies]
